<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="分帳吧">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="旅行分帳 — 無需登入，即時同步">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>分帳吧</title>
<style>
:root {
  --bg: #f0fdfa;
  --card: #ffffff;
  --ink: #134e4a;
  --muted: #5b7c78;
  --accent: #0f766e;
  --accent2: #f59e0b;
  --danger: #dc2626;
  --line: #ccfbf1;
  --shadow: 0 8px 24px rgba(15,118,110,.12);
  --radius: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); min-height: 100%; }
body { padding-top: var(--safe-t); padding-bottom: calc(72px + var(--safe-b)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
.app { max-width: 430px; margin: 0 auto; padding: 12px 14px 24px; }
.topbar {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  position: sticky; top: 0; z-index: 20; background: linear-gradient(180deg, var(--bg) 70%, transparent);
  padding: 8px 0 4px;
}
.topbar h1 { flex: 1; font-size: 1.15rem; margin: 0; letter-spacing: .02em; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; background: var(--card);
  box-shadow: var(--shadow); display: grid; place-items: center; font-size: 1.1rem;
}
.card {
  background: var(--card); border-radius: var(--radius); padding: 14px 14px;
  box-shadow: var(--shadow); margin-bottom: 12px; border: 1px solid var(--line);
}
.card h2 { margin: 0 0 10px; font-size: 0.95rem; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
label.field { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line);
  background: #f8fffe; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[readonly] { background: #eef5f3; color: var(--ink); cursor: default; }
input[readonly]:focus { border-color: var(--line); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 16px; border-radius: 14px; font-weight: 600; background: var(--accent); color: #fff;
  min-height: 44px;
}
.btn.secondary { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); }
.btn.ghost { background: #ecfdf5; color: var(--accent); }
.btn.warn { background: var(--accent2); color: #111; }
.btn.danger { background: var(--danger); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px;
  background: #ecfdf5; color: var(--accent); font-size: 0.82rem; font-weight: 600;
}
.chip.amber { background: #fffbeb; color: #b45309; }
.muted { color: var(--muted); font-size: 0.85rem; }
.small { font-size: 0.78rem; }
.date-tabs {
  display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  padding: 4px 2px 10px; margin: 0 -2px 4px; scrollbar-width: none;
}
.date-tabs::-webkit-scrollbar { display: none; }
.date-tab {
  flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 0.85rem;
  background: #f0fdfa; color: var(--muted); border: 1.5px solid transparent; white-space: nowrap;
}
.date-tab.on { background: var(--accent); color: #fff; }
.day-group { margin-top: 18px; }
.day-group:first-child { margin-top: 6px; }
.day-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; font-weight: 700; font-size: 0.88rem;
  background: #d1fae5; color: #065f46; border-radius: 12px;
  position: sticky; top: 0; z-index: 2;
}
.day-head .sub { font-weight: 600; color: #047857; font-size: 0.78rem; }
.day-person {
  margin: 8px 2px 4px; padding: 8px 10px; border-radius: 10px; background: #f8fffe;
  font-size: 0.78rem; color: var(--muted); line-height: 1.45;
}
.day-person strong { color: var(--ink); font-weight: 600; }
.expense-list { margin-top: 6px; }
.expense {
  padding: 10px 4px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
  align-items: center; border-top: none;
}
.expense + .expense { border-top: 1px solid var(--line); }
.expense .title { font-weight: 600; font-size: 0.95rem; }
.expense .meta { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
.expense .amt { font-weight: 700; text-align: right; white-space: nowrap; font-size: 0.95rem; }
.expense .acts {
  display: inline-flex; gap: 4px; justify-content: flex-end; align-items: center; margin-top: 2px;
}
.expense .acts button {
  font-size: 0.72rem; padding: 3px 8px; border-radius: 8px; background: #f0fdfa; color: var(--accent);
  min-height: 28px;
}

.expense .acts button.del { color: var(--danger); background: #fef2f2; }
.thumb-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.thumb {
  width: 48px; height: 48px; border-radius: 8px; object-fit: cover;
  border: 1px solid var(--line); background: #f1f5f9; cursor: pointer;
}
.photo-editor { margin-top: 12px; }
.photo-editor .grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.photo-slot {
  position: relative; width: 88px; height: 88px; border-radius: 12px;
  overflow: hidden; background: #f1f5f9; border: 1.5px dashed var(--line);
}
.photo-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-slot .rm {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
  border-radius: 999px; background: rgba(0,0,0,.65); color: #fff;
  font-size: 14px; line-height: 24px; text-align: center; padding: 0;
  min-height: 24px;
}
.photo-add {
  width: 88px; height: 88px; border-radius: 12px; border: 1.5px dashed var(--accent);
  background: #ecfdf5; color: var(--accent); font-weight: 700; font-size: 1.4rem;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.lightbox {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.92);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
.lightbox .x {
  position: absolute; top: calc(12px + var(--safe-t)); right: 16px;
  color: #fff; font-size: 1.6rem; background: transparent; min-height: 44px;
}

.member-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
  background: #ecfdf5; margin: 0 6px 6px 0; font-weight: 600; font-size: 0.9rem;
}
.member-pill button { color: var(--danger); font-size: 0.85rem; padding: 0 2px; }
.check-grid { display: grid; gap: 8px; }
.check-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
  background: #f8fffe; border: 1.5px solid var(--line);
}
.check-item.on { border-color: var(--accent); background: #ecfdf5; }
.check-item input { width: 18px; height: 18px; accent-color: var(--accent); }
.check-item .custom-amt { width: 110px; margin-left: auto; padding: 8px; }
.seg {
  display: flex; background: #ecfdf5; border-radius: 12px; padding: 3px; gap: 3px;
}
.seg button {
  flex: 1; padding: 9px; border-radius: 10px; font-weight: 600; color: var(--muted);
}
.seg button.on { background: #fff; color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.fab-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 10px 14px calc(10px + var(--safe-b));
  background: linear-gradient(180deg, transparent, rgba(240,253,250,.95) 30%);
  display: flex; gap: 8px; justify-content: center; max-width: 430px; margin: 0 auto;
}
.fab-bar .btn { flex: 1; max-width: 200px; box-shadow: var(--shadow); }
.modal-bg {
  position: fixed; inset: 0; background: rgba(15,40,38,.45); z-index: 40;
  display: flex; align-items: flex-end; justify-content: center;
}
.modal {
  width: 100%; max-width: 430px; max-height: 92vh; overflow: auto;
  background: var(--card); border-radius: 20px 20px 0 0; padding: 16px 16px calc(20px + var(--safe-b));
  animation: slideUp .22s ease;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal h3 { margin: 0 0 12px; font-size: 1.1rem; }
.modal .close {
  position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 10px;
  background: #f0fdfa; font-size: 1.2rem;
}
.modal-wrap { position: relative; width: 100%; max-width: 430px; }
.toast {
  position: fixed; left: 50%; bottom: calc(80px + var(--safe-b)); transform: translateX(-50%);
  background: #134e4a; color: #fff; padding: 10px 16px; border-radius: 999px; z-index: 50;
  font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity .2s;
  white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: 1; }
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; display: inline-block;
}
.sync-dot.on { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.25); }
.sync-dot.off { background: #f59e0b; }
.settle-card {
  background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 14px; padding: 14px; margin-bottom: 10px;
}
.settle-card .who { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
.settle-card .amt { font-size: 1.35rem; font-weight: 800; color: #b45309; }
.balance-row {
  display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--line);
  font-size: 0.92rem;
}
.balance-row:last-child { border-bottom: none; }
.pos { color: #059669; } .neg { color: #dc2626; }
.hidden { display: none !important; }
.home-hero {
  text-align: center; padding: 28px 8px 18px;
}
.home-hero .logo {
  width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 20px;
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  display: grid; place-items: center; font-size: 2rem; color: #fff; box-shadow: var(--shadow);
}
.home-hero h1 { margin: 0 0 6px; font-size: 1.5rem; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.draft-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 36px; }
.draft-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
  background: #ecfdf5; font-weight: 600; font-size: 0.9rem;
}
.draft-chip button { color: var(--danger); font-size: 0.85rem; padding: 0 2px; line-height: 1; }
.invite-code {
  font-size: 2rem; font-weight: 800; letter-spacing: 0.18em; text-align: center;
  padding: 16px 8px; background: #ecfdf5; border-radius: 16px; margin: 10px 0;
}
.invite-actions { display: grid; gap: 8px; margin-top: 12px; }
.invite-actions .row { gap: 8px; }

.totals {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;
}
.totals .t {
  background: #ecfdf5; border-radius: 12px; padding: 10px; text-align: center;
}
.totals .t .n { font-weight: 800; font-size: 1.05rem; }
.totals .t .l { font-size: 0.72rem; color: var(--muted); }
.hc { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #fff7ed; color: #b45309; font-size: 0.72rem; font-weight: 700; vertical-align: middle; }
.hc.dim { background: #f1f5f9; color: var(--muted); }
.hc-input { width: 64px !important; flex: 0 0 64px; text-align: center; padding: 10px 6px !important; }
.member-edit { display: flex; gap: 8px; align-items: center; }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mhead .muted { font-size: 0.78rem; }
.btn-mini { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; flex: 0 0 auto;
  min-height: 36px; padding: 6px 12px; border-radius: 12px; background: #ecfdf5; color: var(--accent); font-weight: 700; font-size: 0.85rem; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mchip { display: inline-flex; align-items: center; padding: 7px 12px; border-radius: 999px; background: #ecfdf5;
  font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
.mchip .n { color: #b45309; font-weight: 700; margin-left: 4px; font-size: 0.82rem; }
.mlist { display: grid; gap: 8px; }
.mlist-head { display: grid; grid-template-columns: 1fr 132px 44px; gap: 8px; font-size: 0.72rem; color: var(--muted); padding: 0 2px; }
.mlist-head span:nth-child(2) { text-align: center; }
.mrow { display: grid; grid-template-columns: 1fr 132px 44px; gap: 8px; align-items: center; }
.mrow .m-name { height: 44px; min-height: 44px; padding: 0 12px; }
.stepper { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 44px;
  border: 1.5px solid var(--line); border-radius: 12px; background: #f8fffe; overflow: hidden; }
.stepper button { height: 44px; font-size: 1.25rem; font-weight: 700; color: var(--accent); }
.stepper button:disabled { color: #cbd5e1; }
.stepper .n { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.m-del { width: 44px; height: 44px; border-radius: 12px; background: #f1f5f9; color: #94a3b8; display: grid; place-items: center; }
.m-del svg { width: 18px; height: 18px; }
.btn-addrow { width: 100%; min-height: 44px; margin-top: 10px; border-radius: 12px; border: 1.5px dashed var(--accent);
  background: #f0fdfa; color: var(--accent); font-weight: 700; white-space: nowrap; }
.btn, .chip, .date-tab, .seg button { white-space: nowrap; }
.check-item .ratio-inp { width: 80px; margin-left: auto; padding: 8px; }
.seg4 button { padding: 9px 2px; font-size: 0.86rem; }
.rate-box { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #fffbeb; border: 1.5px solid #fde68a; }
.rate-box input { background: #fff; }
.expense .conv { color: var(--muted); font-size: 0.72rem; text-align: right; white-space: nowrap; margin-top: 1px; }
.rate-tag { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 6px; background: #ecfdf5; color: #047857; font-weight: 700; font-size: 0.68rem; }
.rate-tag.warn { background: #fffbeb; color: #b45309; }
.sum-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
.sum-table th { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-align: right; padding: 6px 4px; border-bottom: 1.5px solid var(--line); }
.sum-table th:first-child, .sum-table td:first-child { text-align: left; }
.sum-table td { text-align: right; padding: 9px 4px; white-space: nowrap; }
.sum-table tbody tr + tr td { border-top: 1px solid var(--line); }
.sum-table td.nm { font-weight: 700; white-space: normal; }
.sum-table td .tag { font-size: 0.68rem; font-weight: 700; margin-right: 4px; }
.sum-table tfoot td { border-top: 1.5px solid var(--accent); font-weight: 700; background: #f0fdfa; }
.sum-table td.chk { font-size: 0.78rem; }
.settle-card .sentence { font-size: 1.08rem; font-weight: 700; line-height: 1.5; }

@media print {
  .fab-bar, .topbar .icon-btn, .no-print { display: none !important; }
  body { background: #fff; padding: 0; }

<body>
<div id="app" class="app"></div>
<div id="modal" class="hidden"></div>
<div id="toast" class="toast"></div>
<script>
(function () {
'use strict';

const LS_KEY = 'splitbill_v1';
const CURRENCIES = ['TWD','JPY','USD','EUR','KRW','THB','HKD','CNY','SGD','GBP','AUD','VND'];

let state = {
  view: 'home', // home | created | trip | settle
  trip: null,
  sync: 'off', // on | off | pending
  editingExpenseId: null,
  recentCodes: [],
  expenseDateFilter: 'all', // 'all' | YYYY-MM-DD
};
/** Names staged on the home create form (not yet a trip). */
let homeDraftMembers = [];
/** Create-form fields kept across re-renders. */
let homeDraftForm = { name: '東京之旅', local: 'TWD', home: 'TWD' };
function keepHomeForm() {
  const n = document.querySelector('#new-name');
  if (!n) return;
  homeDraftForm = { name: n.value, local: document.querySelector('#new-local').value, home: document.querySelector('#new-home').value };
}

let es = null;
let saveTimer = null;
let applyingRemote = false;
let saveGen = 0;

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function $(sel, el) { return (el || document).querySelector(sel); }
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.recentCodes) state.recentCodes = data.recentCodes;
    if (data.trips && state.trip && data.trips[state.trip.code]) {
      // handled elsewhere
    }
    state._tripCache = data.trips || {};
  } catch (_) {}
}

function cacheTrip(trip) {
  if (!trip || !trip.code) return;
  try {
    const raw = localStorage.getItem(LS_KEY);
    const data = raw ? JSON.parse(raw) : {};
    data.trips = data.trips || {};
    data.trips[trip.code] = trip;
    data.recentCodes = state.recentCodes;
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch (_) {}
}

function rememberCode(code) {
  code = code.toUpperCase();
  state.recentCodes = [code, ...state.recentCodes.filter(c => c !== code)].slice(0, 8);
  cacheTrip(state.trip);
}

function money(n, cur) {
  const x = Number(n);
  if (!isFinite(x)) return '—';
  const digits = (cur === 'JPY' || cur === 'KRW' || cur === 'VND') ? 0 : 2;
  return x.toLocaleString('zh-TW', { minimumFractionDigits: digits, maximumFractionDigits: digits }) + ' ' + cur;
}

function roundMoney(n, cur) {
  const digits = (cur === 'JPY' || cur === 'KRW' || cur === 'VND') ? 0 : 2;
  const f = Math.pow(10, digits);
  return Math.round((Number(n) + Number.EPSILON) * f) / f;
}

/** YYYY-MM-DD in Asia/Taipei */
function dateInTaipei(ts) {
  const d = ts == null ? new Date() : new Date(ts);
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(d);
}
function todayTaipei() { return dateInTaipei(Date.now()); }
function expenseDate(exp) {
  if (exp && exp.date && /^\d{4}-\d{2}-\d{2}$/.test(exp.date)) return exp.date;
  return dateInTaipei(exp?.createdAt || Date.now());
}
function shiftYmd(ymd, days) {
  const [y, m, d] = ymd.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + days));
  return dt.toISOString().slice(0, 10);
}
function formatDateLabel(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  const week = ['日','一','二','三','四','五','六'];
  const w = week[new Date(Date.UTC(y, m - 1, d, 12)).getUTCDay()];
  const today = todayTaipei();
  const yest = shiftYmd(today, -1);
  let tag = `${m}/${d}（${w}）`;
  if (ymd === today) tag = `今天 · ${tag}`;
  else if (ymd === yest) tag = `昨天 · ${tag}`;
  else tag = `${y}/${tag}`;
  return tag;
}

const SPLIT_LABEL = { equal: '均分', headcount: '按人頭', custom: '自訂金額', ratio: '自訂比例' };

function memberHeadcount(m) {
  const n = Math.floor(Number(m && m.headcount));
  return n > 0 ? n : 1;
}

/** Home-currency units per 1 unit of the expense currency (per-expense; legacy falls back to trip.rate). */
function expenseRate(exp, trip) {
  if (!exp) return 0;
  if (exp.currency === trip.homeCurrency) return 1;
  const r = Number(exp.rate);
  if (r > 0) return r;
  if (exp.currency === trip.localCurrency && Number(trip.rate) > 0) return Number(trip.rate);
  return 0;
}

/** Unrounded home amount = 原幣金額 × 匯率 (same arithmetic as the Excel formula). */
function homeAmountOf(exp, trip) {
  return (Number(exp.amount) || 0) * expenseRate(exp, trip);
}

/** Kept for older call sites: converts with the trip default rate. */
function toHome(amount, currency, trip) {
  return homeAmountOf({ amount, currency }, trip);
}

function memberOrder(trip) {
  const o = {};
  (trip.members || []).forEach((m, i) => { o[m.id] = i; });
  return o;
}

/** Weights per sharer for an expense, in trip member order. */
function shareWeights(exp, trip) {
  const order = memberOrder(trip);
  const shares = [...(exp.shares || [])].sort((a, b) => (order[a.memberId] ?? 999) - (order[b.memberId] ?? 999));
  const byId = {};
  (trip.members || []).forEach(m => { byId[m.id] = m; });
  let w = shares.map(s => {
    let v = 1;
    if (exp.splitType === 'headcount') v = memberHeadcount(byId[s.memberId]);
    else if (exp.splitType === 'custom') v = Math.max(0, Number(s.amount) || 0);
    else if (exp.splitType === 'ratio') v = Math.max(0, Number(s.ratio) || 0);
    return { id: s.memberId, w: v };
  });
  if (!(w.reduce((a, x) => a + x.w, 0) > 0)) w = w.map(x => ({ id: x.id, w: 1 }));
  return w;
}

/**
 * Each sharer's part in home currency. Every share but one is rounded to cents; the
 * remainder goes to the largest share (ties: earlier member), so shares sum to the
 * unrounded home amount exactly.
 */
function computeShares(exp, trip) {
  const total = homeAmountOf(exp, trip);
  const w = shareWeights(exp, trip);
  const sumW = w.reduce((a, x) => a + x.w, 0);
  const out = {};
  if (!w.length || !(sumW > 0)) return out;
  const raw = w.map(x => ({ id: x.id, v: total * x.w / sumW }));
  let hold = 0;
  raw.forEach((x, i) => { if (x.v > raw[hold].v + 1e-9) hold = i; });
  let acc = 0;
  raw.forEach((x, i) => {
    if (i === hold) return;
    const r = Math.round((x.v + Number.EPSILON) * 100) / 100;
    out[x.id] = (out[x.id] || 0) + r;
    acc += r;
  });
  out[raw[hold].id] = (out[raw[hold].id] || 0) + (total - acc);
  return out;
}

/** Per-member paid / owed / balance (unrounded), home currency. */
function memberTotals(trip, items) {
  const res = {};
  (trip.members || []).forEach(m => { res[m.id] = { paid: 0, owed: 0 }; });
  (items || trip.expenses || []).forEach(exp => {
    const amt = homeAmountOf(exp, trip);
    if (exp.payerId) {
      res[exp.payerId] = res[exp.payerId] || { paid: 0, owed: 0 };
      res[exp.payerId].paid += amt;
    }
    const sh = computeShares(exp, trip);
    Object.entries(sh).forEach(([id, v]) => {
      res[id] = res[id] || { paid: 0, owed: 0 };
      res[id].owed += v;
    });
  });
  Object.values(res).forEach(r => { r.balance = r.paid - r.owed; });
  return res;
}

function roundHalfAway(x) {
  const n = Number(x) || 0;
  return Math.sign(n) * Math.round(Math.abs(n) + 1e-9);
}

function splitSummary(exp, trip) {
  const order = memberOrder(trip);
  const sharers = [...(exp.shares || [])].sort((a, b) => (order[a.memberId] ?? 999) - (order[b.memberId] ?? 999));
  if (sharers.length === 1 && sharers[0].memberId === exp.payerId) return `${memberName(exp.payerId)} 自付`;
  const names = sharers.map(s => memberName(s.memberId)).join('、');
  const w = shareWeights(exp, trip).map(x => +x.w.toFixed(4));
  let extra = '';
  if (exp.splitType === 'headcount' || exp.splitType === 'ratio') extra = `（${w.join(':')}）`;
  return `${SPLIT_LABEL[exp.splitType] || "均分"}：${names || "—"}${extra}`;
}

function needsRateCount(trip) {
  return (trip.expenses || []).filter(e => !(expenseRate(e, trip) > 0)).length;
}

function memberName(id) {
  const m = (state.trip?.members || []).find(x => x.id === id);
  return m ? m.name : '?';
}

function expenseTitle(e) {
  const t = (e?.title || '').trim();
  if (t) return t;
  const payer = memberName(e?.payerId) || '成員';
  return `${payer} 付的支出`;
}
function dayPersonSpend(items, trip) {
  const tot = memberTotals(trip, items);
  const home = trip.homeCurrency;
  return (trip.members || []).map(m => {
    const r = tot[m.id] || { paid: 0, owed: 0 };
    const p = roundMoney(r.paid, home);
    const sh = roundMoney(r.owed, home);
    if (Math.abs(p) < 0.005 && Math.abs(sh) < 0.005) return null;
    return `${escapeHtml(m.name)}：付 ${money(p, home)} · 分攤 ${money(sh, home)}`;
  }).filter(Boolean);
}


function parseHash() {
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('t/')) return h.slice(2).toUpperCase();
  const q = new URLSearchParams(location.search);
  if (q.get('code')) return q.get('code').toUpperCase();
  return null;
}

async function api(path, opts) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...(opts?.headers || {}) },
    ...opts,
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }
  if (!res.ok) {
    const err = new Error(data?.error || res.statusText);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function scheduleSave() {
  if (applyingRemote || !state.trip) return;
  saveGen += 1;
  state.trip.updatedAt = Date.now();
  cacheTrip(state.trip);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushTrip, 350);
}

async function pushTrip() {
  if (!state.trip) return;
  const gen = saveGen;
  const snapshot = JSON.parse(JSON.stringify(state.trip));
  state.sync = 'pending';
  updateSyncDot();
  try {
    const saved = await api('/api/trips/' + snapshot.code, {
      method: 'PUT',
      body: JSON.stringify(snapshot),
    });
    // Local mutated while in flight (even same-ms) — keep local and push again
    if (saveGen !== gen) {
      state.sync = 'pending';
      updateSyncDot();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(pushTrip, 200);
      return;
    }
    applyingRemote = true;
    state.trip = saved;
    applyingRemote = false;
    cacheTrip(state.trip);
    state.sync = 'on';
  } catch (e) {
    if (e.status === 409 && e.data?.trip) {
      if (saveGen !== gen || (state.trip && state.trip.updatedAt > (e.data.trip.updatedAt || 0))) {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(pushTrip, 200);
      } else {
        applyingRemote = true;
        state.trip = e.data.trip;
        applyingRemote = false;
        cacheTrip(state.trip);
        state.sync = 'on';
        render();
        toast('已同步較新版本');
      }
    } else {
      state.sync = 'off';
    }
  }
  updateSyncDot();
}

function connectSSE(code) {
  if (es) { try { es.close(); } catch (_) {} es = null; }
  if (!code) return;
  try {
    es = new EventSource('/api/trips/' + code + '/events');
    es.onopen = () => { state.sync = 'on'; updateSyncDot(); };
    es.onerror = () => { state.sync = 'off'; updateSyncDot(); };
    es.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.missing) return;
        if (!data.code) return;
        if (state.trip && data.updatedAt != null && state.trip.updatedAt != null && data.updatedAt <= state.trip.updatedAt) {
          return; // ignore same/older snapshots — never clobber newer local edits
        }
        // ignore empty-ish remote if we have local content with unknown clocks
        if (state.trip && (state.trip.expenses||[]).length > (data.expenses||[]).length &&
            (state.trip.members||[]).length >= (data.members||[]).length &&
            data.updatedAt === state.trip.updatedAt) {
          return;
        }
        applyingRemote = true;
        state.trip = data;
        applyingRemote = false;
        cacheTrip(state.trip);
        state.sync = 'on';
        if (state.view === 'trip' || state.view === 'settle') render();
        else updateSyncDot();
      } catch (_) {}
    };
  } catch (_) {
    state.sync = 'off';
  }
}

function updateSyncDot() {
  const d = document.querySelector('.sync-dot');
  if (!d) return;
  d.className = 'sync-dot ' + (state.sync === 'on' ? 'on' : state.sync === 'pending' ? 'off' : 'off');
  d.title = state.sync === 'on' ? '已連線同步' : state.sync === 'pending' ? '同步中' : '離線／快取';
}

async function fetchRate(trip) {
  if (!trip || trip.rateManual) return;
  const local = trip.localCurrency;
  const home = trip.homeCurrency;
  if (local === home) {
    trip.rate = 1;
    if (state.trip && state.trip.code === trip.code && !state.trip.rateManual) {
      state.trip.rate = 1;
      cacheTrip(state.trip);
      if (state.view === 'trip' || state.view === 'created') render();
    }
    return;
  }
  try {
    const j = await api('/api/rate?from=' + encodeURIComponent(local) + '&to=' + encodeURIComponent(home));
    if (j && j.rate > 0) {
      // Local-only: never push from fetchRate — a joining device's auto-rate
      // PUT was overwriting the creator's newer expenses via a fresher updatedAt.
      if (state.trip && state.trip.code === trip.code && !state.trip.rateManual) {
        state.trip.rate = Number(j.rate);
        cacheTrip(state.trip);
        if (state.view === 'trip' || state.view === 'created') render();
      }
    }
  } catch (_) {}
}

async function createTrip(name, home, local, members) {
  const same = String(home).toUpperCase() === String(local).toUpperCase();
  const trip = await api('/api/trips', {
    method: 'POST',
    body: JSON.stringify({
      name,
      homeCurrency: home,
      localCurrency: local,
      members: Array.isArray(members) ? members : [],
      expenses: [],
      ...(same ? { rate: 1 } : {}),
    }),
  });
  state.trip = trip;
  state.view = 'created';
  homeDraftMembers = [];
  homeDraftForm = { name: '東京之旅', local: 'TWD', home: 'TWD' };
  rememberCode(trip.code);
  location.hash = 't/' + trip.code;
  connectSSE(trip.code);
  fetchRate(trip);
  render();
}

async function joinTrip(code) {
  code = String(code || '').trim().toUpperCase();
  if (!code) { toast('請輸入行程代碼'); return; }
  let fromServer = false;
  try {
    let trip = await api('/api/trips/' + code);
    state.trip = trip;
    fromServer = true;
  } catch (e) {
    // try local cache
    loadLocal();
    const cached = state._tripCache && state._tripCache[code];
    if (cached) {
      state.trip = cached;
      toast('離線載入本機快取');
      // try re-upload
      try { await pushTrip(); } catch (_) {}
    } else {
      toast('找不到行程');
      return;
    }
  }
  state.view = 'trip';
  state.expenseDateFilter = 'all';
  rememberCode(code);
  location.hash = 't/' + code;
  connectSSE(code);
  if (!state.trip.rate && !state.trip.rateManual) fetchRate(state.trip);
  render();
  if (fromServer) refreshProvisionalRates();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已複製');
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();

    ta.remove();

/* ========== Settlement ========== */
function computeBalances(trip) {
  const home = trip.homeCurrency;
  const tot = memberTotals(trip);
  const bal = {};
  Object.entries(tot).forEach(([id, r]) => { bal[id] = roundMoney(r.balance, home); });
  return bal;
}

/** Transfers rounded to whole units (NT$) — matches the Excel 結算 sheet. */
function settleWhole(trip) {
  const home = trip.homeCurrency;
  const tot = memberTotals(trip);
  const ms = trip.members || [];
  if (ms.length === 2) {
    const b = roundHalfAway(tot[ms[0].id]?.balance || 0);
    if (b < 0) return [{ from: ms[0].id, to: ms[1].id, amount: -b }];
    if (b > 0) return [{ from: ms[1].id, to: ms[0].id, amount: b }];
    return [];
  }
  return settleTransfers(computeBalances(trip), home)
    .map(t => ({ ...t, amount: roundHalfAway(t.amount) }))
    .filter(t => t.amount > 0);
}

function homeMoneyWhole(n, home) {
  const v = Math.round(Number(n) || 0).toLocaleString('zh-TW');
  return home === 'TWD' ? `NT$${v}` : `${v} ${home}`;
}

function transferSentence(tr, home) {
  return `${memberName(tr.from)} 要轉 ${homeMoneyWhole(tr.amount, home)} 給 ${memberName(tr.to)}`;
}

function settleTransfers(bal, home) {
  // positive = should receive, negative = owes
  const debtors = [];
  const creditors = [];
  Object.entries(bal).forEach(([id, v]) => {
    if (v < -0.005) debtors.push({ id, amt: -v });
    else if (v > 0.005) creditors.push({ id, amt: v });
  });
  debtors.sort((a, b) => b.amt - a.amt);
  creditors.sort((a, b) => b.amt - a.amt);
  const transfers = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const d = debtors[i], c = creditors[j];
    const pay = roundMoney(Math.min(d.amt, c.amt), home);
    if (pay > 0) {
      transfers.push({ from: d.id, to: c.id, amount: pay });
      d.amt = roundMoney(d.amt - pay, home);
      c.amt = roundMoney(c.amt - pay, home);
    }
    if (d.amt <= 0.005) i++;
    if (c.amt <= 0.005) j++;
  }
  return transfers;
}

function expenseRunningTotals(trip) {
  const byCur = {};
  (trip.expenses || []).forEach(e => {
    byCur[e.currency] = (byCur[e.currency] || 0) + Number(e.amount);
  });
  return byCur;
}

/* ========== Member row editor ========== */
const TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
function memberRowsHtml(list) {
  if (!list.length) return '<p class="muted small" style="margin:4px 2px">還沒有成員，按下方新增</p>';
  return `<div class="mlist-head"><span>名稱</span><span>人數</span><span></span></div>` + list.map(m => `
    <div class="mrow" data-mid="${m.id}">

      <div class="stepper"><button type="button" data-step="-1" aria-label="減少" ${memberHeadcount(m) <= 1 ? 'disabled' : ''}>−</button><span class="n">${memberHeadcount(m)}</span><button type="button" data-step="1" aria-label="增加">+</button></div>
      <button type="button" class="m-del" aria-label="刪除 ${escapeHtml(m.name)}">${TRASH_SVG}</button>
    </div>`).join('');
}
/** Edits `list` (array of {id,name,headcount}) in place. usedIds: members referenced by expenses. */
function mountMemberEditor(root, list, opts = {}) {
  const listEl = root.querySelector('.mlist');
  const draw = (focusIdx) => {
    listEl.innerHTML = memberRowsHtml(list);
    listEl.querySelectorAll('.mrow').forEach((row, i) => {
      const m = list[i];
      const nameInp = row.querySelector('.m-name');
      nameInp.oninput = () => { m.name = nameInp.value; opts.onChange && opts.onChange(); };
      nameInp.onkeydown = (e) => {
        if (e.key !== 'Enter' || e.isComposing) return;
        e.preventDefault();
        if (i === list.length - 1) { if (nameInp.value.trim()) addRow(); }
        else listEl.querySelectorAll('.m-name')[i + 1].focus();
      };
      row.querySelectorAll('[data-step]').forEach(b => {
        b.onclick = () => {
          m.headcount = Math.max(1, Math.min(99, memberHeadcount(m) + Number(b.getAttribute('data-step'))));
          row.querySelector('.n').textContent = m.headcount;
          row.querySelector('[data-step="-1"]').disabled = m.headcount <= 1;
          opts.onChange && opts.onChange();
        };
      });
      row.querySelector('.m-del').onclick = () => {
        const label = (m.name || '').trim();
        if (opts.usedIds && opts.usedIds.has(m.id)) {
          toast(`「${label}」已出現在支出中，不能刪除`);
          return;
        }
        if (label && !confirm(`確定刪除「${label}」？`)) return;
        list.splice(i, 1);
        draw();
        opts.onChange && opts.onChange();
      };
    });
    if (focusIdx != null) listEl.querySelectorAll('.m-name')[focusIdx]?.focus();
  };
  const addRow = () => {
    list.push({ id: uid(), name: '', headcount: 1 });
    draw(list.length - 1);
    opts.onChange && opts.onChange();
  };
  root.querySelector('.btn-addrow').onclick = addRow;
  draw();
}
/** Clean names; returns error text or null. */
function validateMembers(list) {
  const names = list.map(m => (m.name || '').trim()).filter(Boolean);
  if (new Set(names).size !== names.length) return '成員名稱不能重複';
  return null;
}

function openMemberSheet() {
  const t = state.trip;
  const list = (t.members || []).map(m => ({ id: m.id, name: m.name, headcount: memberHeadcount(m) }));
  const used = new Set();
  (t.expenses || []).forEach(e => { used.add(e.payerId); (e.shares || []).forEach(x => used.add(x.memberId)); });
  if (!list.length) list.push({ id: uid(), name: '', headcount: 1 });
  openModal(`
    <button class="close" data-close>×</button>
    <h3>編輯成員</h3>
    <p class="muted small" style="margin:-6px 0 10px">一列一家（或一人）。人數用在「按人頭」分帳</p>
    <div id="member-editor"><div class="mlist"></div><button type="button" class="btn-addrow">＋ 新增成員</button></div>
    <button class="btn block" style="margin-top:14px" id="m-done">完成</button>
  `, (modal) => {
    mountMemberEditor(modal.querySelector('#member-editor'), list, { usedIds: used });
    modal.querySelector('#m-done').onclick = () => {
      // Re-read: a sync may have replaced state.trip while the sheet was open.
      const t = state.trip;
      const usedNow = new Set();
      (t.expenses || []).forEach(e => { usedNow.add(e.payerId); (e.shares || []).forEach(x => usedNow.add(x.memberId)); });
      const keep = new Set(list.filter(x => (x.name || '').trim()).map(x => x.id));
      if ((t.members || []).some(m => usedNow.has(m.id) && !keep.has(m.id))) { toast('有支出用到的成員不能刪除'); return; }
      const err = validateMembers(list);
      if (err) { toast(err); return; }
      const byId = {};
      (t.members || []).forEach(m => { byId[m.id] = m; });
      const next = [];
      for (const x of list) {
        const name = (x.name || '').trim();
        if (!name) {
          if (used.has(x.id)) { toast('有支出用到的成員不能清空名稱'); return; }
          continue;
        }
        next.push({ ...(byId[x.id] || {}), id: x.id, name, headcount: memberHeadcount(x) });
      }
      t.members = next;
      scheduleSave();
      closeModal();
      render();
      toast('成員已更新');
    };
  });
}

  if (!t) return renderHome();

  const members = (t.members || []).map(m => `${escapeHtml(m.name)}（${memberHeadcount(m)}人）`).join('、') || '（尚未加入）';
  const canNativeShare = typeof navigator !== 'undefined' && typeof navigator.share === 'function';
  return `
  <div class="topbar">
    <button class="icon-btn" id="btn-created-home" title="首頁">⌂</button>
    <h1>邀請同行</h1>
    <span style="width:40px"></span>
  </div>
  <div class="card">
    <p class="muted small" style="margin:0 0 4px">行程已建立</p>
    <h2 style="margin:0 0 8px">${escapeHtml(t.name)}</h2>
    <p class="muted small">成員：${members}</p>
    <p class="muted" style="margin-top:12px;margin-bottom:0">把邀請碼或連結傳給朋友，對方免登入即可同步</p>
    <div class="invite-code" id="created-code">${escapeHtml(t.code)}</div>
    <div class="invite-actions">
      <div class="row">
        <input class="grow" readonly value="${escapeHtml(t.code)}" id="created-code-input">
        <button class="btn secondary" id="btn-copy-code">複製代碼</button>
      </div>
      <div class="row">
        <input class="grow" readonly value="${escapeHtml(link)}" id="created-link-input">
        <button class="btn secondary" id="btn-copy-link">複製連結</button>
      </div>
      ${canNativeShare ? '<button class="btn ghost block" id="btn-native-share">系統分享…</button>' : ''}
      <button class="btn block" id="btn-enter-trip">進入行程開始記帳</button>
    </div>
  </div>`;
}

function renderSummaryTable(t, opts = {}) {
  const home = t.homeCurrency;
  const tot = memberTotals(t);
  let sp = 0, so = 0;
  const rows = (t.members || []).map(m => {
    const r = tot[m.id] || { paid: 0, owed: 0, balance: 0 };
    sp += r.paid; so += r.owed;
    const b = roundMoney(r.balance, home);
    const cls = b > 0.005 ? 'pos' : b < -0.005 ? 'neg' : '';
    const tag = b > 0.005 ? '應收' : b < -0.005 ? '應付' : '結清';
    return `<tr>
      <td class="nm">${escapeHtml(m.name)}<span class="hc">${memberHeadcount(m)}人</span></td>
      <td>${fmtNum(r.paid, home)}</td>
      <td>${fmtNum(r.owed, home)}</td>
      <td class="${cls}"><span class="tag">${tag}</span>${fmtNum(Math.abs(r.balance), home)}</td>
    </tr>`;
  }).join('');
  const ok = Math.abs(roundMoney(sp - so, home)) < 0.005;
  return `<table class="sum-table">
    <thead><tr><th>成員</th><th>已付</th><th>應分</th><th>差額</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>合計</td><td>${fmtNum(sp, home)}</td><td>${fmtNum(so, home)}</td><td class="chk ${ok ? 'pos' : 'neg'}">${ok ? '✔ 相符' : '✘ 不符'}</td></tr></tfoot>
  </table>
  ${opts.note === false ? '' : `<p class="muted small" style="margin:6px 0 0">單位 ${home}。已付＝自己付掉的錢；應分＝該負擔的錢；差額＝已付－應分</p>`}`;
}

function fmtNum(n, cur) {
  const digits = (cur === 'JPY' || cur === 'KRW' || cur === 'VND') ? 0 : (cur === 'TWD' ? 0 : 2);
  return (Number(n) || 0).toLocaleString('zh-TW', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function rateLabel(e, t) {
  if (e.currency === t.homeCurrency) return '';
  const r = expenseRate(e, t);
  if (!(r > 0)) return '<span class="rate-tag warn">缺匯率</span>';
  let tag = '';
  if (e.rateManual) tag = '手動';
  else if (e.rateProvisional) tag = '暫定';
  else if (e.rateSource === 'bot' || e.rateSource === 'bot-mirror') tag = '台銀';
  else if (!e.rate) tag = '預設';
  return `≈ ${money(roundMoney(homeAmountOf(e, t), t.homeCurrency), t.homeCurrency)} · ${r}${tag ? `<span class="rate-tag ${e.rateProvisional ? 'warn' : ''}">${tag}</span>` : ''}`;
}

function renderTrip() {
  const t = state.trip;
  const totals = expenseRunningTotals(t);
  const totalHomeApprox = (t.expenses || []).reduce((s, e) => s + homeAmountOf(e, t), 0);
  const multiCur = t.localCurrency !== t.homeCurrency;

    <button class="icon-btn" id="btn-home" title="首頁">⌂</button>

    <div class="mhead"><span class="muted">成員 ${(t.members || []).length ? `· ${(t.members || []).length}` : ''}</span><button type="button" class="btn-mini" id="btn-edit-members">編輯成員</button></div>
    <div class="mchips">
      ${(t.members||[]).map(m => `<span class="mchip">${escapeHtml(m.name)}${memberHeadcount(m) > 1 ? `<span class="n">·${memberHeadcount(m)}</span>` : ''}</span>`).join('') || '<span class="muted small">尚未加入成員</span>'}
    </div>
    <div class="totals">
      <div class="t"><div class="n">${money(roundMoney(totalHomeApprox, t.homeCurrency), t.homeCurrency)}</div><div class="l">支出合計（${t.homeCurrency}）</div></div>
      <div class="t"><div class="n">${(t.expenses||[]).length}</div><div class="l">筆支出 · ${Object.keys(totals).map(c=>c).join('/')||'—'}</div></div>

    </div>
    ${(() => {
      const list = [...(t.expenses || [])];
      if (!list.length) return '<div class="empty">還沒有支出<br>點下方「記一筆」開始</div>';
      const byDate = {};
      list.forEach(e => {
        const d = expenseDate(e);

      });
      const days = Object.keys(byDate).sort((a, b) => b.localeCompare(a));
      const filter = state.expenseDateFilter;
      const active = (filter && filter !== 'all' && byDate[filter]) ? filter : 'all';
      if (filter !== active) state.expenseDateFilter = active;
      const tabLabel = (ymd) => {
        const [y, m, d] = ymd.split('-').map(Number);
        const week = ['日','一','二','三','四','五','六'];
        const w = week[new Date(Date.UTC(y, m - 1, d, 12)).getUTCDay()];
        return `${m}/${d}（${w}）`;
      };
      const tabs = `<div class="date-tabs" id="date-tabs">
        <button type="button" class="date-tab ${active==='all'?'on':''}" data-date-tab="all">全部</button>
        ${days.map(d => `<button type="button" class="date-tab ${active===d?'on':''}" data-date-tab="${d}">${tabLabel(d)}</button>`).join('')}

      const showDays = active === 'all' ? days : [active];
      const groups = showDays.map(day => {
        const items = byDate[day].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        const dayHome = items.reduce((s, e) => s + homeAmountOf(e, t), 0);
        const personLines = dayPersonSpend(items, t);
        const detail = active !== 'all'
          ? `<div class="day-person">${personLines.map(l => `<div>${l}</div>`).join('') || '<div>尚無分攤</div>'}</div>`
          : '';
        const rows = items.map(e => {
          const thumbs = (e.photoIds||[]).map(pid =>
            `<img class="thumb" src="/api/trips/${t.code}/photos/${pid}" alt="收據" data-photo-view="${pid}" loading="lazy">`
          ).join('');
          return `<div class="expense" data-exp="${e.id}">
            <div>
              <div class="title">${escapeHtml(expenseTitle(e))}</div>
              <div class="meta">${escapeHtml(memberName(e.payerId))} 付 · ${escapeHtml(splitSummary(e, t))}</div>
              ${e.note ? `<div class="meta">📝 ${escapeHtml(e.note)}</div>` : ''}
              ${thumbs ? `<div class="thumb-row">${thumbs}</div>` : ''}

            <div style="text-align:right">

          </div>`;
        }).join('');
        return `<div class="day-group">
          <div class="day-head"><span>${formatDateLabel(day)}</span><span class="sub">小計 ${money(roundMoney(dayHome, t.homeCurrency), t.homeCurrency)}</span></div>
          ${detail}
          <div class="expense-list">${rows}</div>
        </div>`;
      }).join('');
      return tabs + groups;
    })()}
  </div>
  <div class="fab-bar no-print">
    <button class="btn secondary" id="btn-settle">結算</button>
    <button class="btn" id="btn-add-exp">記一筆</button>

}

  const totalHome = exps.reduce((a, e) => a + homeAmountOf(e, t), 0);

  const lines = [];
  lines.push(`【${t.name}】結算總表（${home}）`);
  lines.push(`共 ${exps.length} 筆，合計 ${money(roundMoney(totalHome, home), home)}`);

  lines.push('— 每家已付／應分／差額 —');
  (t.members || []).forEach(m => {
    const r = tot[m.id] || { paid: 0, owed: 0, balance: 0 };

    </div>

      }
      <p class="muted small" style="margin:6px 0 0">${(t.members || []).length > 2 ? '以最少筆數清帳，' : ''}金額四捨五入到元，和匯出的 Excel 一致</p>

/* ========== Excel export ========== */
let excelJsPromise = null;
function loadExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if (!excelJsPromise) {
    excelJsPromise = new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = '/vendor/exceljs.min.js';
      sc.onload = () => resolve(window.ExcelJS);
      sc.onerror = () => { excelJsPromise = null; reject(new Error('exceljs_load')); };
      document.head.appendChild(sc);
    });
  }
  return excelJsPromise;
}

function colLetter(n) { // 1-based
  let s = '';
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

function sortedExpenses(t) {
  return [...(t.expenses || [])].sort((a, b) =>
    expenseDate(a).localeCompare(expenseDate(b)) || (a.createdAt || 0) - (b.createdAt || 0));
}

function expenseNote(e, t) {
  const parts = [];
  if (e.note) parts.push(e.note);
  parts.push(splitSummary(e, t));
  if (e.currency !== t.homeCurrency) {
    if (e.rateManual) parts.push('手動匯率');
    else if (e.rateProvisional) parts.push('暫定匯率（用 ' + (e.rateDate || '今天') + ' 台銀）');
    else if (e.rateDate && e.rateDate !== expenseDate(e)) parts.push('匯率取 ' + e.rateDate + ' 台銀（前一營業日）');
    else if (!e.rate) parts.push('行程預設匯率');
  }
  return parts.join('；');
}

async function buildXlsx(t) {
  const ExcelJS = await loadExcelJS();
  const home = t.homeCurrency;
  const homeLbl = home === 'TWD' ? '台幣' : home;
  const members = t.members || [];
  const exps = sortedExpenses(t);
  const wb = new ExcelJS.Workbook();
  wb.creator = '分帳吧';
  wb.created = new Date();
  wb.calcProperties = { fullCalcOnLoad: true };

  const ws = wb.addWorksheet('明細', { views: [{ state: 'frozen', ySplit: 1 }] });
  const nShare = members.length;
  const firstShareCol = 8;
  const lastShareCol = firstShareCol + nShare - 1;
  const noteCol = lastShareCol + 1;
  const L = colLetter;
  const headers = ['日期', '項目', '原幣金額', '幣別', '匯率', `${homeLbl}金額`, '誰付', ...members.map(m => `${m.name}應分`), '備註'];
  ws.addRow(headers);
  const widths = [12, 20, 12, 7, 10, 13, 12, ...members.map(m => Math.max(12, m.name.length * 2 + 6)), 36];
  widths.forEach((w, i) => { ws.getColumn(i + 1).width = w; });
  const head = ws.getRow(1);
  head.height = 22;
  head.eachCell(c => {
    c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F766E' } };
    c.alignment = { vertical: 'middle', horizontal: 'center' };
  });
  exps.forEach((e, i) => {
    const r = i + 2;
    const rate = expenseRate(e, t);
    const amt = Number(e.amount) || 0;
    const sh = computeShares(e, t);
    const [y, mo, d] = expenseDate(e).split('-').map(Number);
    const row = ws.addRow([
      new Date(Date.UTC(y, mo - 1, d)),
      expenseTitle(e),
      amt,
      e.currency,
      rate,
      { formula: `C${r}*E${r}`, result: amt * rate },
      memberName(e.payerId),
      ...members.map(m => sh[m.id] || 0),
      expenseNote(e, t),
    ]);
    row.getCell(1).numFmt = 'yyyy/mm/dd';
    row.getCell(3).numFmt = Number.isInteger(amt) ? '#,##0' : '#,##0.00';
    row.getCell(5).numFmt = '0.0000';
    row.getCell(6).numFmt = '#,##0.00';
    for (let c = firstShareCol; c <= lastShareCol; c++) row.getCell(c).numFmt = '#,##0.00';
    row.getCell(noteCol).alignment = { wrapText: true, vertical: 'top' };
  });
  const lastData = exps.length + 1;
  const totRowIdx = lastData + 1;
  const totRow = ws.getRow(totRowIdx);
  totRow.getCell(2).value = '合計';
  const sumF = exps.reduce((a, e) => a + homeAmountOf(e, t), 0);
  totRow.getCell(6).value = { formula: `SUM(F2:F${lastData})`, result: sumF };
  const owedTot = memberTotals(t);
  members.forEach((m, k) => {
    const c = firstShareCol + k;
    totRow.getCell(c).value = { formula: `SUM(${L(c)}2:${L(c)}${lastData})`, result: owedTot[m.id]?.owed || 0 };
  });
  totRow.eachCell({ includeEmpty: true }, (c, col) => {
    if (col > noteCol) return;
    c.font = { bold: true };
    c.border = { top: { style: 'thin', color: { argb: 'FF0F766E' } } };
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFECFDF5' } };
    if (col === 6 || (col >= firstShareCol && col <= lastShareCol)) c.numFmt = '#,##0.00';
  });
  if (exps.length) {
    ws.addConditionalFormatting({
      ref: `A2:${L(noteCol)}${lastData}`,
      rules: [{
        type: 'expression',
        priority: 1,
        formulae: [`ROUND(SUM($${L(firstShareCol)}2:$${L(lastShareCol)}2)-$F2,2)<>0`],
        style: {
          fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FFFCA5A5' } },
          font: { color: { argb: 'FF991B1B' }, bold: true },
        },
      }],
    });
  }
  ws.getRow(totRowIdx + 2).getCell(2).value = `說明：${homeLbl}金額＝原幣金額×匯率；每列各家應分加總＝${homeLbl}金額，不相等整列會變紅。`;
  ws.getRow(totRowIdx + 2).getCell(2).font = { color: { argb: 'FF5B7C78' }, italic: true };

  // ---- 結算 ----
  const ss = wb.addWorksheet('結算', { views: [{ state: 'frozen', ySplit: 1 }] });
  ss.addRow(['成員', '人數', '已付合計', '應分合計', '差額（正＝應收，負＝應付）']);
  [16, 8, 14, 14, 26].forEach((w, i) => { ss.getColumn(i + 1).width = w; });
  ss.getRow(1).eachCell(c => {
    c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F766E' } };
    c.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
  });
  ss.getRow(1).height = 30;
  const D = `'明細'!`;
  members.forEach((m, k) => {
    const r = k + 2;
    const c = L(firstShareCol + k);
    const mt = owedTot[m.id] || { paid: 0, owed: 0, balance: 0 };
    const row = ss.addRow([
      m.name,
      memberHeadcount(m),
      { formula: `SUMIF(${D}$G$2:$G$${lastData},A${r},${D}$F$2:$F$${lastData})`, result: mt.paid },
      { formula: `SUM(${D}${c}$2:${c}$${lastData})`, result: mt.owed },
      { formula: `C${r}-D${r}`, result: mt.paid - mt.owed },
    ]);
    [3, 4, 5].forEach(ci => { row.getCell(ci).numFmt = '#,##0.00;[Red]-#,##0.00'; });
  });
  const lastM = members.length + 1;
  const tr = lastM + 1;
  const sp = members.reduce((a, m) => a + (owedTot[m.id]?.paid || 0), 0);
  const so = members.reduce((a, m) => a + (owedTot[m.id]?.owed || 0), 0);
  const sumRow = ss.addRow([
    '合計',
    { formula: `SUM(B2:B${lastM})`, result: members.reduce((a, m) => a + memberHeadcount(m), 0) },
    { formula: `SUM(C2:C${lastM})`, result: sp },
    { formula: `SUM(D2:D${lastM})`, result: so },
    { formula: `C${tr}-D${tr}`, result: sp - so },
  ]);
  sumRow.eachCell(c => {
    c.font = { bold: true };
    c.border = { top: { style: 'thin', color: { argb: 'FF0F766E' } } };
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFECFDF5' } };
  });
  [3, 4, 5].forEach(ci => { sumRow.getCell(ci).numFmt = '#,##0.00;[Red]-#,##0.00'; });
  ss.addRow([]);
  const okNow = Math.abs(Math.round((sp - so) * 100)) === 0;
  const chk = ss.addRow(['檢查', { formula: `IF(ROUND(C${tr}-D${tr},2)=0,"✔ 已付總和＝應分總和","✘ 已付總和≠應分總和")`, result: okNow ? '✔ 已付總和＝應分總和' : '✘ 已付總和≠應分總和' }]);
  chk.getCell(1).font = { bold: true };
  chk.getCell(2).font = { bold: true, color: { argb: okNow ? 'FF047857' : 'FFDC2626' } };
  ss.mergeCells(`B${chk.number}:E${chk.number}`);
  ss.addRow([]);
  const transfers = settleWhole(t);
  const unit = home === 'TWD' ? 'NT$' : '';
  const unitSuffix = home === 'TWD' ? '' : ' ' + home;
  const sentenceFor = (x) => `${memberName(x.from)} 要轉 ${unit}${Math.round(x.amount).toLocaleString('en-US')}${unitSuffix} 給 ${memberName(x.to)}`;
  const resultRowStart = ss.rowCount + 1;
  if (members.length === 2) {
    const f = `IF(ROUND(E2,0)<0,A2&" 要轉 ${unit}"&FIXED(-ROUND(E2,0),0)&"${unitSuffix} 給 "&A3,IF(ROUND(E2,0)>0,A3&" 要轉 ${unit}"&FIXED(ROUND(E2,0),0)&"${unitSuffix} 給 "&A2,"已結清，不用轉帳"))`;
    const res = transfers.length ? sentenceFor(transfers[0]) : '已結清，不用轉帳';
    const row = ss.addRow(['結果', { formula: f, result: res }]);
    ss.mergeCells(`B${row.number}:E${row.number}`);
  } else if (!transfers.length) {
    const row = ss.addRow(['結果', '已結清，不用轉帳']);
    ss.mergeCells(`B${row.number}:E${row.number}`);
  } else {
    transfers.forEach((x, i) => {
      const row = ss.addRow([i === 0 ? '結果' : '', sentenceFor(x)]);
      ss.mergeCells(`B${row.number}:E${row.number}`);
    });
  }
  for (let r = resultRowStart; r <= ss.rowCount; r++) {
    ss.getRow(r).getCell(1).font = { bold: true };
    ss.getRow(r).getCell(2).font = { bold: true, size: 14, color: { argb: 'FFB45309' } };
    ss.getRow(r).height = 24;
  }
  const noteRow = ss.addRow(['', members.length > 2
    ? '金額四捨五入到元；多於兩家時依 App 的最少轉帳演算法列出。'
    : '金額依 E2 差額四捨五入到元。']);
  noteRow.getCell(2).font = { italic: true, color: { argb: 'FF5B7C78' } };
  ss.mergeCells(`B${noteRow.number}:E${noteRow.number}`);

  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

async function exportXlsx() {
  const t = state.trip;
  if (!t || !(t.expenses || []).length) { toast('尚無支出可匯出'); return; }
  const btn = $('#btn-export-xlsx');
  if (btn) { btn.disabled = true; btn.textContent = '產生中…'; }
  try {
    const blob = await buildXlsx(t);
    const safe = String(t.name || '分帳').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 40);
    const fname = `${safe}_分帳_${todayTaipei()}.xlsx`;
    const isTouch = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
    if (isTouch && typeof File === 'function' && navigator.canShare) {
      const file = new File([blob], fname, { type: blob.type });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: fname });
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return;
        }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast('已匯出 Excel');
  } catch (e) {
    console.error(e);
    toast('匯出失敗，請再試一次');
  } finally {
    const b = $('#btn-export-xlsx');
    if (b) { b.disabled = false; b.textContent = '匯出 Excel（.xlsx）'; }
  }
}

}

/* ========== Bank of Taiwan rates ========== */
const botRateCache = {};
async function botRateOne(cur, date) {
  if (cur === 'TWD') return { currency: 'TWD', rate: 1, rateDate: date, provisional: false, source: 'identity' };
  const key = cur + '|' + date;
  const hit = botRateCache[key];
  if (hit && ((!hit.provisional && hit.rateDate < todayTaipei()) || Date.now() - hit._at < 10 * 60 * 1000)) return hit;
  const j = await api(`/api/bot-rate?currency=${encodeURIComponent(cur)}&date=${encodeURIComponent(date)}`);
  j._at = Date.now();
  botRateCache[key] = j;
  return j;
}
/** Home units per 1 `cur` on `date`, from BoT cash selling (cross via TWD when home ≠ TWD). */
async function getBotRate(cur, date, home) {
  const a = await botRateOne(cur, date);
  if (home === 'TWD') return a;
  const b = await botRateOne(home, date);
  return { ...a, rate: Number((a.rate / b.rate).toPrecision(6)), cross: true, provisional: !!(a.provisional || b.provisional) };
}
function rateStatusText(st) {
  if (!st) return '';
  if (st.manual) return '手動輸入';
  if (st.loading) return '抓台銀匯率中…';
  if (st.error) return '抓不到台銀匯率，請手動輸入';
  if (!st.rateDate) return '';
  const md = st.rateDate.slice(5).replace('-', '/');
  if (st.provisional) return `暫定：用今天（${md}）台銀現金賣出，當天會自動更新`;
  return `台銀 ${md} 現金賣出${st.cross ? '（換算）' : ''}${st.fallback ? '（前一營業日）' : ''}`;
}

/** After loading a trip from the server: replace provisional rates whose date has arrived. */
async function refreshProvisionalRates() {
  const t = state.trip;
  if (!t) return;
  const today = todayTaipei();
  const todo = (t.expenses || []).filter(e => e.rateProvisional && !e.rateManual && e.currency !== t.homeCurrency && expenseDate(e) <= today);
  if (!todo.length) return;
  let changed = false;
  for (const e of todo) {
    try {
      const j = await getBotRate(e.currency, expenseDate(e), t.homeCurrency);
      if (j.provisional || !(j.rate > 0)) continue;
      const cur = (state.trip.expenses || []).find(x => x.id === e.id);
      if (!cur || cur.rateManual || !cur.rateProvisional) continue;
      Object.assign(cur, { rate: j.rate, rateDate: j.rateDate, rateSource: j.source, rateProvisional: false });
      changed = true;
    } catch (_) {}
  }
  if (changed) { scheduleSave(); render(); toast('已更新暫定匯率'); }
}

      rateSrc.style.color = rateSt && (rateSt.provisional || rateSt.error) ? '#b45309' : rateSt && rateSt.manual ? 'var(--muted)' : '#047857';
    };
    const currentRate = () => curSel.value === home ? 1 : (parseFloat(rateInp.value) || 0);
    const autoRate = async (force) => {
      const cur = curSel.value;
      if (cur === home) { rateWrap.classList.add('hidden'); updateHint(); return; }
      rateWrap.classList.remove('hidden');
      modal.querySelector('#e-rate-label').textContent = `匯率（1 ${cur} = ? ${home}）`;
      if (rateSt && rateSt.manual && !force) { showRateStatus(); updateHint(); return; }
      const my = ++rateToken;
      rateSt = { loading: true };
      showRateStatus();
      try {
        const j = await getBotRate(cur, dateInp.value || todayTaipei(), home);
        if (my !== rateToken) return;
        rateInp.value = j.rate;
        rateSt = { manual: false, rateDate: j.rateDate, provisional: !!j.provisional, source: j.source, cross: !!j.cross,
          fallback: !j.provisional && j.rateDate !== (dateInp.value || todayTaipei()) };
      } catch (_) {
        if (my !== rateToken) return;
        rateSt = { error: true };
        if (!rateInp.value && cur === t.localCurrency && Number(t.rate) > 0) rateInp.value = t.rate;
      }
      showRateStatus();
      updateHint();
    };
    rateInp.oninput = () => { rateToken++; rateSt = { manual: true }; showRateStatus(); updateHint(); };
    modal.querySelector('#e-rate-bot').onclick = () => autoRate(true);
    const checkedRows = () => [...modal.querySelectorAll('.check-item')].filter(x => x.querySelector('input[type=checkbox]').checked);
    const customSum = () => checkedRows().reduce((a, row) => a + (parseFloat(row.querySelector('.custom-amt').value) || 0), 0);
    const syncAmountField = () => {
      if (mode === 'custom') {
        amountInput.readOnly = true;
        amountInput.value = String(roundMoney(customSum(), curSel.value));
        if (amountLabel) amountLabel.textContent = '金額（自訂加總）';
      } else {
        amountInput.readOnly = false;
        if (amountLabel) amountLabel.textContent = '金額';
      }
    };
    const draftExpense = () => ({
      amount: parseFloat(amountInput.value) || 0,
      currency: curSel.value,
      rate: currentRate(),
      payerId: modal.querySelector('#e-payer').value,
      splitType: mode,
      shares: checkedRows().map(row => ({
        memberId: row.getAttribute('data-mid'),
        amount: parseFloat(row.querySelector('.custom-amt').value) || 0,
        ratio: parseFloat(row.querySelector('.ratio-inp').value) || 0,
      })),
    });
    const updateHint = () => {
      const hint = modal.querySelector('#e-hint');
      const d = draftExpense();
      if (!d.shares.length) { hint.textContent = '請勾選分攤的成員'; return; }
      const parts = [];
      if (mode === 'custom') parts.push(`總額自動加總：${roundMoney(d.amount, d.currency)} ${d.currency}`);
      if (d.currency !== home) {
        if (d.rate > 0 && d.amount > 0) parts.push(`≈ ${money(roundMoney(d.amount * d.rate, home), home)}`);
      }
      if (d.amount > 0 && (d.currency === home || d.rate > 0)) {
        const sh = computeShares(d, t);
        const each = t.members.filter(m => m.id in sh).map(m => `${m.name} ${fmtNum(sh[m.id], home)}`).join('、');
        parts.push(`應分（${home}）：${each}`);
      }
      hint.textContent = parts.join(' · ');
    };
    const syncModeUI = () => {
      modal.querySelectorAll('.custom-amt').forEach(inp => inp.classList.toggle('hidden', mode !== 'custom'));
      modal.querySelectorAll('.ratio-inp').forEach(inp => inp.classList.toggle('hidden', mode !== 'ratio'));
      modal.querySelectorAll('.check-item .hc').forEach(x => x.classList.toggle('dim', mode !== 'headcount'));
      syncAmountField();
      updateHint();
    };
    modal.querySelectorAll('#e-split button').forEach(btn => {
      btn.onclick = () => {
        mode = btn.getAttribute('data-split');
        modal.querySelectorAll('#e-split button').forEach(b => b.classList.toggle('on', b === btn));
        syncModeUI();
      };
    });
    modal.querySelectorAll('.check-item').forEach(row => {
      const cb = row.querySelector('input[type=checkbox]');
      cb.onchange = () => {
        row.classList.toggle('on', cb.checked);
        row.querySelectorAll('.custom-amt, .ratio-inp').forEach(x => { x.disabled = !cb.checked; });
        if (mode === 'custom') syncAmountField();
        updateHint();
      };
      row.querySelectorAll('.custom-amt, .ratio-inp').forEach(x => {
        x.oninput = () => { if (mode === 'custom') syncAmountField(); updateHint(); };
      });
    });
    amountInput.oninput = updateHint;
    modal.querySelector('#e-payer').onchange = updateHint;
    curSel.onchange = () => { if (mode === 'custom') syncAmountField(); if (rateSt && rateSt.manual) rateSt = null; autoRate(false); };
    dateInp.onchange = () => autoRate(false);
    syncModeUI();
    if (curSel.value !== home && !(exp && Number(exp.rate) > 0)) autoRate(false);
    else if (curSel.value !== home) { modal.querySelector('#e-rate-label').textContent = `匯率（1 ${curSel.value} = ? ${home}）`; showRateStatus(); }
    else rateWrap.classList.add('hidden');

    modal.querySelector('#e-save').onclick = () => {
      const t = state.trip; // re-read: a sync may have replaced it while the sheet was open
      const title = modal.querySelector('#e-title').value.trim();
      const currency = curSel.value;
      const payerId = modal.querySelector('#e-payer').value;
      const shares = [];
      let bad = false;
      checkedRows().forEach(row => {
        const mid = row.getAttribute('data-mid');
        if (mode === 'custom') {
          const a = parseFloat(row.querySelector('.custom-amt').value);
          if (!(a >= 0)) { bad = true; return; }
          shares.push({ memberId: mid, amount: a });
        } else if (mode === 'ratio') {
          const r = parseFloat(row.querySelector('.ratio-inp').value);
          if (!(r >= 0)) { bad = true; return; }
          shares.push({ memberId: mid, ratio: r });
        } else {
          shares.push({ memberId: mid });
        }
      });
      if (bad) { toast(mode === 'ratio' ? '請填比例' : '請填自訂金額'); return; }
      if (!shares.length) { toast('請至少勾選一位分攤'); return; }
      if (mode === 'ratio' && !(shares.reduce((a, x) => a + x.ratio, 0) > 0)) { toast('比例加總要大於 0'); return; }
      let amount;
      if (mode === 'custom') {
        amount = roundMoney(shares.reduce((a, x) => a + x.amount, 0), currency);
        amountInput.value = String(amount);
      } else {
        amount = parseFloat(amountInput.value);
      }
      if (!(amount > 0)) { toast(mode === 'custom' ? '請填自訂金額' : '請輸入金額'); return; }
      const rate = currentRate();
      if (currency !== home && !(rate > 0)) { toast('請填匯率'); return; }
      if (rateSt && rateSt.loading) { toast('匯率還在抓，稍等一下'); return; }
      const dateVal = dateInp.value || todayTaipei();
      const payload = {
        id: exp?.id || uid(),
        title, amount, currency, payerId,
        date: dateVal,
        splitType: mode,
        shares,
        rate: currency === home ? 1 : rate,
        rateManual: currency === home ? false : !!(rateSt && rateSt.manual),
        rateProvisional: currency === home ? false : !!(rateSt && !rateSt.manual && rateSt.provisional),
        rateDate: currency === home ? dateVal : (rateSt && rateSt.rateDate) || null,
        rateSource: currency === home ? 'identity' : (rateSt && rateSt.manual ? 'manual' : (rateSt && rateSt.source) || null),
        note: modal.querySelector('#e-note').value.trim(),
        updatedAt: Date.now(),
        createdAt: exp?.createdAt || Date.now(),
      };
      payload.photoIds = [...existingPhotoIds];
      if (exp) {
        const idx = t.expenses.findIndex(e => e.id === exp.id);
        if (idx >= 0) t.expenses[idx] = payload; else t.expenses.push(payload);
      } else {
        t.expenses.push(payload);
      }
      // Upload pending photos after expense exists on trip
      const uploadPending = async () => {
        for (const ph of pendingPhotos) {
          try {
            const r = await fetch(`/api/trips/${t.code}/expenses/${payload.id}/photos`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ dataUrl: ph.dataUrl }),
            });
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              throw new Error(err.error || 'upload');
            }
            const j = await r.json();
            payload.photoIds = payload.photoIds || [];
            if (!payload.photoIds.includes(j.id)) payload.photoIds.push(j.id);
            // refresh from server trip after saveTrip on server
          } catch (e) {
            toast('照片上傳失敗');
          }
        }
      };
      scheduleSave();
      closeModal();
      render();
      toast(exp ? '已更新' : '已記一筆');
      if (pendingPhotos.length) {
        uploadPending().then(async () => {
          // pull latest so photoIds sync
          try {
            const r = await fetch(`/api/trips/${t.code}`);
            if (r.ok) {
              const fresh = await r.json();
              if (fresh && fresh.updatedAt >= (state.trip.updatedAt || 0)) {
                state.trip = fresh;
                cacheTrip(state.trip);
                render();
              }
            }
          } catch (_) {}
        });
      }
    };
  });
}


function openLightbox(src) {
  const el = document.createElement('div');
  el.className = 'lightbox';
  el.innerHTML = `<button type="button" class="x" aria-label="關閉">×</button><img src="${src}" alt="收據">`;
  el.querySelector('.x').onclick = () => el.remove();
  el.onclick = (ev) => { if (ev.target === el) el.remove(); };
  document.body.appendChild(el);
}

async function compressImageFile(file, maxEdge = 1280, quality = 0.7, targetBytes = 300 * 1024) {
  const bitmap = await createImageBitmap(file);
  let w = bitmap.width, h = bitmap.height;
  const scale = Math.min(1, maxEdge / Math.max(w, h));
  w = Math.max(1, Math.round(w * scale));
  h = Math.max(1, Math.round(h * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, w, h);
  bitmap.close && bitmap.close();
  let q = quality;
  let blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
  while (blob && blob.size > targetBytes && q > 0.35) {
    q -= 0.1;
    blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
  }
  if (!blob) throw new Error('compress');
  // If still huge, shrink further
  if (blob.size > targetBytes) {
    const scale2 = Math.sqrt(targetBytes / blob.size) * 0.95;
    canvas.width = Math.max(1, Math.round(w * scale2));
    canvas.height = Math.max(1, Math.round(h * scale2));
    ctx.drawImage(await createImageBitmap(blob), 0, 0, canvas.width, canvas.height);
    blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.65));
  }
  if (!blob || blob.size > 350 * 1024) throw new Error('too_large');
  return await new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

async function boot() {
  loadLocal();
  const code = parseHash();
  if (code) {
    await joinTrip(code);
  } else {
    render();
  }
  window.addEventListener('hashchange', () => {
    const c = parseHash();
    if (c && (!state.trip || state.trip.code !== c)) joinTrip(c);
    if (!c && state.view !== 'home') {
      state.view = 'home';
      render();
    }
  });
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-photo-view]');
    if (!t || !state.trip) return;
    const pid = t.getAttribute('data-photo-view');
    openLightbox(`/api/trips/${state.trip.code}/photos/${pid}`);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.trip) {
      connectSSE(state.trip.code);
      pushTrip();
    }
  });
}

boot();
})();
</script>
