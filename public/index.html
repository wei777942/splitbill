<title>分帳吧</title>
<style>
:root {
  --bg: #f0fdfa;
  --card: #ffffff;
  --ink: #134e4a;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); min-height: 100%; }
body { padding-top: var(--safe-t); padding-bottom: calc(72px + var(--safe-b)); }
button, input, select, textarea { font: inherit; color: inherit; }

.app { max-width: 430px; margin: 0 auto; padding: 12px 14px 24px; }
.topbar {

.icon-btn {

  box-shadow: var(--shadow); display: grid; place-items: center; font-size: 1.1rem;
}

.row { display: flex; gap: 8px; align-items: center; }

label.field { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line);

}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[readonly] { background: #eef5f3; color: var(--ink); cursor: default; }
input[readonly]:focus { border-color: var(--line); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;

  display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;

}

.day-group { margin-top: 18px; }

.photo-add {

.lightbox {

.member-pill {

}

}

.fab-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 10px 14px calc(10px + var(--safe-b));

  display: flex; gap: 8px; justify-content: center; max-width: 430px; margin: 0 auto;
}

.modal-bg {
  position: fixed; inset: 0; background: rgba(15,40,38,.45); z-index: 40;

}
.modal {

  animation: slideUp .22s ease;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal h3 { margin: 0 0 12px; font-size: 1.1rem; }

}

.toast {
  position: fixed; left: 50%; bottom: calc(80px + var(--safe-b)); transform: translateX(-50%);
  background: #134e4a; color: #fff; padding: 10px 16px; border-radius: 999px; z-index: 50;

}

}

.settle-card {
  background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 14px; padding: 14px; margin-bottom: 10px;
}

.balance-row {

  font-size: 0.92rem;
}
.balance-row:last-child { border-bottom: none; }

.home-hero {
  text-align: center; padding: 28px 8px 18px;
}
.home-hero .logo {
  width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 20px;
  background: linear-gradient(135deg, #0f766e, #14b8a6);

}
.home-hero h1 { margin: 0 0 6px; font-size: 1.5rem; }

.draft-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 36px; }
.draft-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
  background: #ecfdf5; font-weight: 600; font-size: 0.9rem;
}

  font-size: 2rem; font-weight: 800; letter-spacing: 0.18em; text-align: center;
  padding: 16px 8px; background: #ecfdf5; border-radius: 16px; margin: 10px 0;
}
.invite-actions { display: grid; gap: 8px; margin-top: 12px; }
.invite-actions .row { gap: 8px; }

.totals {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;
}
.totals .t {
  background: #ecfdf5; border-radius: 12px; padding: 10px; text-align: center;
}
.totals .t .n { font-weight: 800; font-size: 1.05rem; }
.totals .t .l { font-size: 0.72rem; color: var(--muted); }

<body>
<div id="app" class="app"></div>
<div id="modal" class="hidden"></div>
<div id="toast" class="toast"></div>
<script>
(function () {
'use strict';

const LS_KEY = 'splitbill_v1';
const CURRENCIES = ['TWD','JPY','USD','EUR','KRW','THB','HKD','CNY','SGD','GBP','AUD','VND'];

let state = {
  view: 'home', // home | created | trip | settle
  trip: null,
  sync: 'off', // on | off | pending
  editingExpenseId: null,
  recentCodes: [],
  expenseDateFilter: 'all', // 'all' | YYYY-MM-DD
};
/** Names staged on the home create form (not yet a trip). */
let homeDraftMembers = [];

let es = null;
let saveTimer = null;
let applyingRemote = false;
let saveGen = 0;

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function $(sel, el) { return (el || document).querySelector(sel); }
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.recentCodes) state.recentCodes = data.recentCodes;
    if (data.trips && state.trip && data.trips[state.trip.code]) {
      // handled elsewhere
    }
    state._tripCache = data.trips || {};
  } catch (_) {}
}

function cacheTrip(trip) {
  if (!trip || !trip.code) return;
  try {
    const raw = localStorage.getItem(LS_KEY);
    const data = raw ? JSON.parse(raw) : {};
    data.trips = data.trips || {};
    data.trips[trip.code] = trip;
    data.recentCodes = state.recentCodes;
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch (_) {}
}

function rememberCode(code) {
  code = code.toUpperCase();
  state.recentCodes = [code, ...state.recentCodes.filter(c => c !== code)].slice(0, 8);
  cacheTrip(state.trip);
}

function money(n, cur) {
  const x = Number(n);
  if (!isFinite(x)) return '—';
  const digits = (cur === 'JPY' || cur === 'KRW' || cur === 'VND') ? 0 : 2;
  return x.toLocaleString('zh-TW', { minimumFractionDigits: digits, maximumFractionDigits: digits }) + ' ' + cur;
}

function roundMoney(n, cur) {
  const digits = (cur === 'JPY' || cur === 'KRW' || cur === 'VND') ? 0 : 2;
  const f = Math.pow(10, digits);
  return Math.round((Number(n) + Number.EPSILON) * f) / f;
}

/** YYYY-MM-DD in Asia/Taipei */
function dateInTaipei(ts) {
  const d = ts == null ? new Date() : new Date(ts);
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(d);
}
function todayTaipei() { return dateInTaipei(Date.now()); }
function expenseDate(exp) {
  if (exp && exp.date && /^\d{4}-\d{2}-\d{2}$/.test(exp.date)) return exp.date;
  return dateInTaipei(exp?.createdAt || Date.now());
}
function shiftYmd(ymd, days) {
  const [y, m, d] = ymd.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + days));
  return dt.toISOString().slice(0, 10);
}
function formatDateLabel(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  const week = ['日','一','二','三','四','五','六'];
  const w = week[new Date(Date.UTC(y, m - 1, d, 12)).getUTCDay()];
  const today = todayTaipei();
  const yest = shiftYmd(today, -1);
  let tag = `${m}/${d}（${w}）`;
  if (ymd === today) tag = `今天 · ${tag}`;
  else if (ymd === yest) tag = `昨天 · ${tag}`;
  else tag = `${y}/${tag}`;
  return tag;
}

function toHome(amount, currency, trip) {
  const home = trip.homeCurrency;
  const local = trip.localCurrency;
  const amt = Number(amount) || 0;
  if (currency === home) return amt;
  // rate = how many HOME per 1 LOCAL (e.g. TWD per JPY)
  const rate = Number(trip.rate) || 0;
  if (currency === local) return amt * rate;
  // other currency: treat rate as home-per-local only; if somehow other, assume 1:1 warn
  if (rate > 0 && currency !== home) {
    // fallback: no cross rates — leave as amount (shouldn't happen if UI only allows home/local)
    return amt;
  }
  return amt;
}

function memberName(id) {
  const m = (state.trip?.members || []).find(x => x.id === id);
  return m ? m.name : '?';
}

function expenseTitle(e) {
  const t = (e?.title || '').trim();
  if (t) return t;
  const payer = memberName(e?.payerId) || '成員';
  return `${payer} 付的支出`;
}
function dayPersonSpend(items, trip) {
  const paid = {};
  const share = {};
  (trip.members || []).forEach(m => { paid[m.id] = 0; share[m.id] = 0; });
  items.forEach(exp => {
    const homeAmt = toHome(exp.amount, exp.currency, trip);
    if (exp.payerId) paid[exp.payerId] = (paid[exp.payerId] || 0) + homeAmt;
    const shares = exp.shares || [];
    if (!shares.length) return;
    if (exp.splitType === 'custom') {
      shares.forEach(s => {
        share[s.memberId] = (share[s.memberId] || 0) + toHome(Number(s.amount) || 0, exp.currency, trip);
      });
    } else {
      const each = homeAmt / shares.length;
      shares.forEach(s => { share[s.memberId] = (share[s.memberId] || 0) + each; });
    }
  });
  const home = trip.homeCurrency;
  return (trip.members || []).map(m => {
    const p = roundMoney(paid[m.id] || 0, home);
    const s = roundMoney(share[m.id] || 0, home);
    if (Math.abs(p) < 0.005 && Math.abs(s) < 0.005) return null;
    return `${escapeHtml(m.name)}：付 ${money(p, home)} · 分攤 ${money(s, home)}`;
  }).filter(Boolean);
}


function parseHash() {
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('t/')) return h.slice(2).toUpperCase();
  const q = new URLSearchParams(location.search);
  if (q.get('code')) return q.get('code').toUpperCase();
  return null;
}

async function api(path, opts) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...(opts?.headers || {}) },
    ...opts,
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }
  if (!res.ok) {
    const err = new Error(data?.error || res.statusText);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function scheduleSave() {
  if (applyingRemote || !state.trip) return;
  saveGen += 1;
  state.trip.updatedAt = Date.now();
  cacheTrip(state.trip);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushTrip, 350);
}

async function pushTrip() {
  if (!state.trip) return;
  const gen = saveGen;
  const snapshot = JSON.parse(JSON.stringify(state.trip));
  state.sync = 'pending';
  updateSyncDot();
  try {
    const saved = await api('/api/trips/' + snapshot.code, {
      method: 'PUT',
      body: JSON.stringify(snapshot),
    });
    // Local mutated while in flight (even same-ms) — keep local and push again
    if (saveGen !== gen) {
      state.sync = 'pending';
      updateSyncDot();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(pushTrip, 200);
      return;
    }
    applyingRemote = true;
    state.trip = saved;
    applyingRemote = false;
    cacheTrip(state.trip);
    state.sync = 'on';
  } catch (e) {
    if (e.status === 409 && e.data?.trip) {
      if (saveGen !== gen || (state.trip && state.trip.updatedAt > (e.data.trip.updatedAt || 0))) {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(pushTrip, 200);
      } else {
        applyingRemote = true;
        state.trip = e.data.trip;
        applyingRemote = false;
        cacheTrip(state.trip);
        state.sync = 'on';
        render();
        toast('已同步較新版本');
      }
    } else {
      state.sync = 'off';
    }
  }
  updateSyncDot();
}

function connectSSE(code) {
  if (es) { try { es.close(); } catch (_) {} es = null; }
  if (!code) return;
  try {
    es = new EventSource('/api/trips/' + code + '/events');
    es.onopen = () => { state.sync = 'on'; updateSyncDot(); };
    es.onerror = () => { state.sync = 'off'; updateSyncDot(); };
    es.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.missing) return;
        if (!data.code) return;
        if (state.trip && data.updatedAt != null && state.trip.updatedAt != null && data.updatedAt <= state.trip.updatedAt) {
          return; // ignore same/older snapshots — never clobber newer local edits
        }
        // ignore empty-ish remote if we have local content with unknown clocks
        if (state.trip && (state.trip.expenses||[]).length > (data.expenses||[]).length &&
            (state.trip.members||[]).length >= (data.members||[]).length &&
            data.updatedAt === state.trip.updatedAt) {
          return;
        }
        applyingRemote = true;
        state.trip = data;
        applyingRemote = false;
        cacheTrip(state.trip);
        state.sync = 'on';
        if (state.view === 'trip' || state.view === 'settle') render();
        else updateSyncDot();
      } catch (_) {}
    };
  } catch (_) {
    state.sync = 'off';
  }
}

function updateSyncDot() {
  const d = document.querySelector('.sync-dot');
  if (!d) return;
  d.className = 'sync-dot ' + (state.sync === 'on' ? 'on' : state.sync === 'pending' ? 'off' : 'off');
  d.title = state.sync === 'on' ? '已連線同步' : state.sync === 'pending' ? '同步中' : '離線／快取';
}

async function fetchRate(trip) {
  if (!trip || trip.rateManual) return;
  const local = trip.localCurrency;
  const home = trip.homeCurrency;
  if (local === home) {
    trip.rate = 1;
    if (state.trip && state.trip.code === trip.code && !state.trip.rateManual) {
      state.trip.rate = 1;
      cacheTrip(state.trip);
      if (state.view === 'trip' || state.view === 'created') render();
    }
    return;
  }
  try {
    const j = await api('/api/rate?from=' + encodeURIComponent(local) + '&to=' + encodeURIComponent(home));
    if (j && j.rate > 0) {
      // Local-only: never push from fetchRate — a joining device's auto-rate
      // PUT was overwriting the creator's newer expenses via a fresher updatedAt.
      if (state.trip && state.trip.code === trip.code && !state.trip.rateManual) {
        state.trip.rate = Number(j.rate);
        cacheTrip(state.trip);
        if (state.view === 'trip' || state.view === 'created') render();
      }
    }
  } catch (_) {}
}

async function createTrip(name, home, local, members) {
  const same = String(home).toUpperCase() === String(local).toUpperCase();
  const trip = await api('/api/trips', {
    method: 'POST',
    body: JSON.stringify({
      name,
      homeCurrency: home,
      localCurrency: local,
      members: Array.isArray(members) ? members : [],
      expenses: [],
      ...(same ? { rate: 1 } : {}),
    }),
  });
  state.trip = trip;
  state.view = 'created';
  homeDraftMembers = [];
  rememberCode(trip.code);
  location.hash = 't/' + trip.code;
  connectSSE(trip.code);
  fetchRate(trip);
  render();
}

async function joinTrip(code) {
  code = String(code || '').trim().toUpperCase();
  if (!code) { toast('請輸入行程代碼'); return; }
  try {
    let trip = await api('/api/trips/' + code);
    state.trip = trip;
  } catch (e) {
    // try local cache
    loadLocal();
    const cached = state._tripCache && state._tripCache[code];
    if (cached) {
      state.trip = cached;
      toast('離線載入本機快取');
      // try re-upload
      try { await pushTrip(); } catch (_) {}
    } else {
      toast('找不到行程');
      return;
    }
  }
  state.view = 'trip';
  state.expenseDateFilter = 'all';
  rememberCode(code);
  location.hash = 't/' + code;
  connectSSE(code);
  if (!state.trip.rate && !state.trip.rateManual) fetchRate(state.trip);
  render();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已複製');
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text;

    ta.remove();
    toast('已複製');
  }
}

/* ========== Settlement ========== */
function computeBalances(trip) {
  const home = trip.homeCurrency;
  const bal = {};
  (trip.members || []).forEach(m => { bal[m.id] = 0; });
  (trip.expenses || []).forEach(exp => {
    const totalHome = toHome(exp.amount, exp.currency, trip);
    const payer = exp.payerId;
    if (!(payer in bal)) bal[payer] = 0;
    bal[payer] += totalHome;
    const shares = exp.shares || [];
    if (!shares.length) return;
    if (exp.splitType === 'custom') {
      const sumShare = shares.reduce((s, x) => s + (Number(x.amount) || 0), 0);
      // custom amounts are in expense currency
      shares.forEach(s => {
        const part = toHome(Number(s.amount) || 0, exp.currency, trip);
        if (!(s.memberId in bal)) bal[s.memberId] = 0;
        bal[s.memberId] -= part;
      });
      // residual due to rounding / mismatch: dump on payer's share if any
      const allocated = shares.reduce((s, x) => s + toHome(Number(x.amount) || 0, exp.currency, trip), 0);
      const diff = totalHome - allocated;
      if (Math.abs(diff) > 0.001) {
        // if custom doesn't sum to total, adjust first sharer
        const first = shares[0];
        if (first) bal[first.memberId] -= diff;
      }
    } else {
      // equal split among checked members
      const n = shares.length;
      const each = totalHome / n;
      shares.forEach(s => {
        if (!(s.memberId in bal)) bal[s.memberId] = 0;
        bal[s.memberId] -= each;
      });
    }
  });
  // round
  Object.keys(bal).forEach(id => { bal[id] = roundMoney(bal[id], home); });
  return bal;
}

function settleTransfers(bal, home) {
  // positive = should receive, negative = owes
  const debtors = [];
  const creditors = [];
  Object.entries(bal).forEach(([id, v]) => {
    if (v < -0.005) debtors.push({ id, amt: -v });
    else if (v > 0.005) creditors.push({ id, amt: v });
  });
  debtors.sort((a, b) => b.amt - a.amt);
  creditors.sort((a, b) => b.amt - a.amt);
  const transfers = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const d = debtors[i], c = creditors[j];
    const pay = roundMoney(Math.min(d.amt, c.amt), home);
    if (pay > 0) {
      transfers.push({ from: d.id, to: c.id, amount: pay });
      d.amt = roundMoney(d.amt - pay, home);
      c.amt = roundMoney(c.amt - pay, home);
    }
    if (d.amt <= 0.005) i++;
    if (c.amt <= 0.005) j++;
  }
  return transfers;
}

function expenseRunningTotals(trip) {
  const byCur = {};
  (trip.expenses || []).forEach(e => {
    byCur[e.currency] = (byCur[e.currency] || 0) + Number(e.amount);
  });
  return byCur;
}

      if (!list.length) return '<div class="empty">還沒有支出<br>點下方「記一筆」開始</div>';

function renderSettle() {
  const t = state.trip;
  const home = t.homeCurrency;
  const bal = computeBalances(t);
  const transfers = settleTransfers({ ...bal }, home);
  const lines = [];
  lines.push(`【${t.name}】結算（${home}）`);
  lines.push(`匯率：1 ${t.localCurrency} = ${t.rate != null ? roundMoney(t.rate, home) : '?'} ${home}`);
  lines.push('— 餘額 —');
  (t.members || []).forEach(m => {
    const v = bal[m.id] || 0;
    const tag = v > 0.005 ? '應收' : v < -0.005 ? '應付' : '結清';
    lines.push(`${m.name}：${tag} ${money(Math.abs(v), home)}`);
  });
  lines.push('— 轉帳建議（最少筆數）—');
  if (transfers.length === 0) lines.push('已結清，無需轉帳');
  else transfers.forEach(tr => {
    lines.push(`${memberName(tr.from)} → ${memberName(tr.to)}：${money(tr.amount, home)}`);
  });
  const text = lines.join('\n');
  window.__settleText = text;

  return `
  <div class="topbar">
    <button class="icon-btn" id="btn-back-trip" title="返回">←</button>
    <h1>結算</h1>
    <button class="icon-btn" id="btn-copy-settle" title="複製">⧉</button>
  </div>
  <div class="screenshot-area" id="settle-shot">
    <div class="card">
      <h2 style="margin-top:0">${escapeHtml(t.name)} · ${home}</h2>
      <p class="muted small">1 ${t.localCurrency} = ${t.rate != null ? roundMoney(t.rate, home) : '？'} ${home}${t.rateManual?'（手動）':''}</p>

        ${(t.members||[]).map(m => {
          const v = bal[m.id] || 0;
          const cls = v > 0.005 ? 'pos' : v < -0.005 ? 'neg' : '';
          const label = v > 0.005 ? '應收' : v < -0.005 ? '應付' : '結清';
          return `<div class="balance-row"><span>${escapeHtml(m.name)}</span><span class="${cls}">${label} ${money(Math.abs(v), home)}</span></div>`;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <h2>轉帳建議</h2>
      <p class="muted small">以最少筆數清帳（貪婪演算法）</p>
      ${transfers.length === 0 ? '<div class="empty">已結清 🎉</div>' :
        transfers.map(tr => `
          <div class="settle-card">
            <div class="who">${escapeHtml(memberName(tr.from))} → ${escapeHtml(memberName(tr.to))}</div>
            <div class="amt">${money(tr.amount, home)}</div>

      }

    <button class="btn" id="btn-back-trip2">回記帳</button>
  </div>
`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  else if (state.view === 'created') app.innerHTML = renderCreated();

  else app.innerHTML = renderTrip();

}

  if (state.view === 'home') {

      if (inp) inp.value = '';
      render();
      $('#new-member')?.focus();
    };
    $('#btn-add-draft')?.addEventListener('click', addDraft);
    $('#new-member')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); addDraft(); }
    });

      b.addEventListener('click', () => {
        const id = b.getAttribute('data-rm-draft');
        homeDraftMembers = homeDraftMembers.filter(m => m.id !== id);
        render();
      });
    });
    $('#btn-create')?.addEventListener('click', async () => {
      const name = $('#new-name').value.trim() || '新行程';
      const home = $('#new-home').value;
      const local = $('#new-local').value;

      catch (e) { toast('建立失敗'); console.error(e); }
    });
    $('#btn-join')?.addEventListener('click', () => joinTrip($('#join-code').value));
    document.querySelectorAll('[data-recent]').forEach(b => {
      b.addEventListener('click', () => joinTrip(b.getAttribute('data-recent')));
    });
    return;
  }

  if (state.view === 'created') {
    const link = shareLink();
    $('#btn-created-home')?.addEventListener('click', () => {
      state.view = 'home';
      location.hash = '';
      if (es) { try { es.close(); } catch(_){} es = null; }
      render();
    });
    $('#btn-copy-code')?.addEventListener('click', () => copyText(state.trip.code));
    $('#btn-copy-link')?.addEventListener('click', () => copyText(link));
    $('#btn-native-share')?.addEventListener('click', async () => {
      try {
        await navigator.share({
          title: state.trip.name + ' · 旅行分帳',
          text: `一起用「旅行分帳」記帳，邀請碼 ${state.trip.code}`,
          url: link,
        });
      } catch (e) {
        if (e && e.name !== 'AbortError') toast('無法開啟系統分享');
      }
    });
    $('#btn-enter-trip')?.addEventListener('click', () => {
      state.view = 'trip';
      state.expenseDateFilter = 'all';
      render();
    });
    return;
  }

  if (state.view === 'settle') {
    $('#btn-back-trip')?.addEventListener('click', () => { state.view = 'trip'; render(); });
    $('#btn-back-trip2')?.addEventListener('click', () => { state.view = 'trip'; render(); });
    const copy = () => copyText(window.__settleText || '');
    $('#btn-copy-settle')?.addEventListener('click', copy);
    $('#btn-copy-settle2')?.addEventListener('click', copy);
    return;
  }

  // trip view
  $('#btn-home')?.addEventListener('click', () => {
    state.view = 'home';
    location.hash = '';
    if (es) { try { es.close(); } catch(_){} es = null; }
    render();
  });
  $('#btn-share')?.addEventListener('click', () => {
    const link = shareLink();
    openModal(`
      <button class="close" data-close>×</button>
      <h3>分享行程</h3>
      <p class="muted">朋友開啟連結或輸入代碼即可同步（免登入）</p>
      <label class="field">代碼</label>
      <div class="row"><input class="grow" readonly value="${state.trip.code}" id="share-code"><button class="btn secondary" id="copy-code">複製</button></div>
      <label class="field" style="margin-top:10px">連結</label>
      <div class="row"><input class="grow" readonly value="${link}" id="share-link"><button class="btn secondary" id="copy-link">複製</button></div>
    `, (modal) => {
      modal.querySelector('#copy-code').onclick = () => copyText(state.trip.code);
      modal.querySelector('#copy-link').onclick = () => copyText(link);
    });
  });
  $('#btn-settings')?.addEventListener('click', openSettings);
  $('#btn-add-member')?.addEventListener('click', () => {
    openModal(`
      <button class="close" data-close>×</button>
      <h3>新增成員</h3>
      <label class="field">暱稱</label>
      <input type="text" id="m-name" placeholder="例如：小明" maxlength="24">
      <button class="btn block" style="margin-top:14px" id="m-save">加入</button>
    `, (modal) => {
      const inp = modal.querySelector('#m-name');
      inp.focus();
      modal.querySelector('#m-save').onclick = () => {
        const name = inp.value.trim();
        if (!name) { toast('請輸入暱稱'); return; }
        state.trip.members.push({ id: uid(), name });
        scheduleSave();
        closeModal();
        render();
      };
    });
  });
  document.querySelectorAll('[data-del-member]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.getAttribute('data-del-member');
      if ((state.trip.expenses || []).some(e => e.payerId === id || (e.shares||[]).some(s => s.memberId === id))) {
        toast('此成員已出現在支出中，無法刪除');
        return;
      }
      state.trip.members = state.trip.members.filter(m => m.id !== id);
      scheduleSave();
      render();
    });
  });
  document.querySelectorAll('[data-date-tab]').forEach(b => {
    b.addEventListener('click', () => {
      state.expenseDateFilter = b.getAttribute('data-date-tab') || 'all';
      render();
    });
  });
  $('#btn-add-exp')?.addEventListener('click', () => openExpenseModal(null));
  document.querySelectorAll('[data-edit-exp]').forEach(b => {
    b.addEventListener('click', () => openExpenseModal(b.getAttribute('data-edit-exp')));
  });
  document.querySelectorAll('[data-del-exp]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.getAttribute('data-del-exp');
      if (!confirm('確定刪除此支出？')) return;
      state.trip.expenses = state.trip.expenses.filter(e => e.id !== id);
      scheduleSave();
      render();
    });
  });
  $('#btn-settle')?.addEventListener('click', () => {
    if (!(state.trip.members || []).length) { toast('請先新增成員'); return; }
    if (!(state.trip.expenses || []).length) { toast('尚無支出可結算'); return; }
    if (state.trip.localCurrency === state.trip.homeCurrency) {
      if (!(state.trip.rate > 0)) state.trip.rate = 1;
    } else if (state.trip.rate == null || !(state.trip.rate > 0)) {
      toast('請先在設定中確認匯率');
      openSettings();
      return;
    }
    state.view = 'settle';
    render();
  });
}

function openSettings() {
  const t = state.trip;
  openModal(`
    <button class="close" data-close>×</button>
    <h3>行程設定</h3>
    <label class="field">名稱</label>
    <input type="text" id="s-name" value="${escapeHtml(t.name)}" maxlength="80">
    <div class="row" style="margin-top:10px;gap:10px">
      <div class="grow">
        <label class="field">當地幣</label>
        <select id="s-local">${CURRENCIES.map(c => `<option value="${c}" ${c===t.localCurrency?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="grow">
        <label class="field">回家幣</label>
        <select id="s-home">${CURRENCIES.map(c => `<option value="${c}" ${c===t.homeCurrency?'selected':''}>${c}</option>`).join('')}</select>
      </div>
    </div>
    <label class="field" style="margin-top:10px">匯率（1 當地幣 = ? 回家幣）</label>
    <div class="row">
      <input class="grow" type="number" id="s-rate" step="any" min="0" value="${t.rate != null ? t.rate : ''}" placeholder="自動或手動">
      <button class="btn secondary" id="s-fetch">更新</button>
    </div>
    <label class="check-item" style="margin-top:10px">
      <input type="checkbox" id="s-manual" ${t.rateManual?'checked':''}>
      <span>使用手動匯率（不自動覆寫）</span>
    </label>
    <button class="btn block" style="margin-top:14px" id="s-save">儲存</button>
  `, (modal) => {
    modal.querySelector('#s-fetch').onclick = async () => {
      t.rateManual = false;
      modal.querySelector('#s-manual').checked = false;
      await fetchRate(t);
      modal.querySelector('#s-rate').value = t.rate != null ? t.rate : '';
      toast(t.rate != null ? '已更新匯率' : '匯率取得失敗');
      render();
    };
    modal.querySelector('#s-save').onclick = () => {
      t.name = modal.querySelector('#s-name').value.trim() || t.name;
      t.localCurrency = modal.querySelector('#s-local').value;
      t.homeCurrency = modal.querySelector('#s-home').value;
      const r = parseFloat(modal.querySelector('#s-rate').value);
      t.rateManual = modal.querySelector('#s-manual').checked;
      if (t.localCurrency === t.homeCurrency) {
        t.rate = 1;
      } else if (isFinite(r) && r > 0) {
        t.rate = r;
      }
      scheduleSave();
      closeModal();
      render();
      toast('已儲存');
    };
  });
}

function openExpenseModal(editId) {
  const t = state.trip;
  if (!(t.members || []).length) { toast('請先新增成員'); return; }
  const exp = editId ? t.expenses.find(e => e.id === editId) : null;
  const defaultCurrency = exp?.currency || t.localCurrency;
  const splitType = exp?.splitType || 'equal';
  const selected = new Set((exp?.shares || []).map(s => s.memberId));
  if (!exp) t.members.forEach(m => selected.add(m.id));
  const customMap = {};
  (exp?.shares || []).forEach(s => { if (s.amount != null) customMap[s.memberId] = s.amount; });
  const defaultDate = expenseDate(exp) || todayTaipei();

  openModal(`
    <button class="close" data-close>×</button>
    <h3>${exp ? '編輯支出' : '記一筆'}</h3>
    <label class="field">項目</label>
    <input type="text" id="e-title" maxlength="80" placeholder="例如：晚餐" value="${escapeHtml(exp?.title || '')}">
    <label class="field" style="margin-top:10px">日期</label>
    <input type="date" id="e-date" value="${defaultDate}">
    <div class="row" style="margin-top:10px;gap:10px">
      <div class="grow">
        <label class="field">金額</label>
        <input type="number" id="e-amount" step="any" min="0" inputmode="decimal" value="${exp ? exp.amount : ''}">
      </div>
      <div style="width:110px">
        <label class="field">幣別</label>
        <select id="e-cur">
          ${[...new Set([t.localCurrency, t.homeCurrency])].map(c => `<option value="${c}" ${defaultCurrency===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    </div>
    <label class="field" style="margin-top:10px">誰付的</label>
    <select id="e-payer">
      ${t.members.map(m => `<option value="${m.id}" ${exp?.payerId===m.id?'selected':''}>${escapeHtml(m.name)}</option>`).join('')}
    </select>
    <label class="field" style="margin-top:10px">分攤方式</label>
    <div class="seg" id="e-split">
      <button type="button" data-split="equal" class="${splitType==='equal'?'on':''}">平均分</button>
      <button type="button" data-split="custom" class="${splitType==='custom'?'on':''}">自訂金額</button>
    </div>
    <label class="field" style="margin-top:10px">誰一起分（可不全選）</label>
    <div class="check-grid" id="e-shares">
      ${t.members.map(m => {
        const on = selected.has(m.id);
        return `<label class="check-item ${on?'on':''}" data-mid="${m.id}">
          <input type="checkbox" ${on?'checked':''}>
          <span class="grow">${escapeHtml(m.name)}</span>
          <input type="number" class="custom-amt ${splitType==='custom'?'':'hidden'}" step="any" min="0" inputmode="decimal"
            placeholder="金額" value="${customMap[m.id] != null ? customMap[m.id] : ''}" ${on?'':'disabled'}>
        </label>`;
      }).join('')}
    </div>
    <p class="muted small" id="e-hint" style="margin-top:8px"></p>
    <div class="photo-editor">
      <label class="field">收據照片（最多 3 張）</label>
      <div class="grid" id="e-photos"></div>
      <input type="file" id="e-photo-file" accept="image/*" capture="environment" class="hidden" multiple>
      <p class="muted small" style="margin-top:6px">可拍照或從相簿選取，會自動壓縮後上傳</p>
    </div>
    <button class="btn block" style="margin-top:12px" id="e-save">${exp ? '儲存變更' : '新增'}</button>
  `, (modal) => {
    let mode = splitType;
    let pendingPhotos = []; // {dataUrl} not yet uploaded
    let existingPhotoIds = Array.isArray(exp?.photoIds) ? [...exp.photoIds] : [];
    const photoGrid = modal.querySelector('#e-photos');
    const fileInput = modal.querySelector('#e-photo-file');
    const renderPhotoGrid = () => {
      const slots = [];
      existingPhotoIds.forEach(pid => {
        slots.push(`<div class="photo-slot" data-existing="${pid}">
          <img src="/api/trips/${t.code}/photos/${pid}" alt="">
          <button type="button" class="rm" data-rm-existing="${pid}">×</button>
        </div>`);
      });
      pendingPhotos.forEach((ph, i) => {
        slots.push(`<div class="photo-slot" data-pending="${i}">
          <img src="${ph.dataUrl}" alt="">
          <button type="button" class="rm" data-rm-pending="${i}">×</button>
        </div>`);
      });
      const total = existingPhotoIds.length + pendingPhotos.length;
      if (total < 3) {
        slots.push(`<button type="button" class="photo-add" id="e-photo-add" aria-label="新增照片">＋</button>`);
      }
      photoGrid.innerHTML = slots.join('');
      const addBtn = photoGrid.querySelector('#e-photo-add');
      if (addBtn) addBtn.onclick = () => fileInput.click();
      photoGrid.querySelectorAll('[data-rm-existing]').forEach(btn => {
        btn.onclick = async () => {
          const pid = btn.getAttribute('data-rm-existing');
          try {
            const r = await fetch(`/api/trips/${t.code}/photos/${pid}`, { method: 'DELETE' });
            if (!r.ok) throw new Error('del');
            existingPhotoIds = existingPhotoIds.filter(x => x !== pid);
            if (exp) exp.photoIds = existingPhotoIds;
            renderPhotoGrid();
            toast('已刪照片');
          } catch (_) { toast('刪除失敗'); }
        };
      });
      photoGrid.querySelectorAll('[data-rm-pending]').forEach(btn => {
        btn.onclick = () => {
          const i = Number(btn.getAttribute('data-rm-pending'));
          pendingPhotos.splice(i, 1);
          renderPhotoGrid();
        };
      });
      photoGrid.querySelectorAll('.photo-slot img').forEach(img => {
        img.onclick = () => openLightbox(img.src);
      });
    };
    fileInput.onchange = async () => {
      const files = [...(fileInput.files || [])];
      fileInput.value = '';
      for (const f of files) {
        if (existingPhotoIds.length + pendingPhotos.length >= 3) { toast('最多 3 張照片'); break; }
        try {
          const dataUrl = await compressImageFile(f);
          pendingPhotos.push({ dataUrl });
        } catch (err) {
          toast('圖片處理失敗');
        }
      }
      renderPhotoGrid();
    };
    renderPhotoGrid();
    const amountInput = modal.querySelector('#e-amount');
    const amountLabel = amountInput.closest('.grow')?.querySelector('label.field');
    const customSum = () => {
      let sum = 0;
      modal.querySelectorAll('.check-item').forEach(row => {
        if (!row.querySelector('input[type=checkbox]').checked) return;
        sum += parseFloat(row.querySelector('.custom-amt').value) || 0;
      });
      return sum;
    };
    const syncAmountField = () => {
      if (mode === 'custom') {
        amountInput.readOnly = true;
        amountInput.value = String(roundMoney(customSum(), modal.querySelector('#e-cur').value));
        if (amountLabel) amountLabel.textContent = '金額（自訂加總）';
      } else {
        amountInput.readOnly = false;
        if (amountLabel) amountLabel.textContent = '金額';
      }
    };
    const updateHint = () => {
      const checked = [...modal.querySelectorAll('.check-item')].filter(x => x.querySelector('input[type=checkbox]').checked);
      const hint = modal.querySelector('#e-hint');
      const cur = modal.querySelector('#e-cur').value;
      if (mode === 'equal') {
        const amount = parseFloat(amountInput.value) || 0;
        hint.textContent = checked.length ? `每人約 ${roundMoney(amount / checked.length, cur)} ${cur}` : '請勾選分攤成員';
      } else {
        const sum = customSum();
        hint.textContent = checked.length
          ? `總額自動加總：${roundMoney(sum, cur)} ${cur}`
          : '請勾選分攤成員並填金額';
      }
    };
    const syncCustomVisibility = () => {
      modal.querySelectorAll('.custom-amt').forEach(inp => {
        inp.classList.toggle('hidden', mode !== 'custom');
      });
      syncAmountField();
      updateHint();
    };
    modal.querySelectorAll('#e-split button').forEach(btn => {
      btn.onclick = () => {
        mode = btn.getAttribute('data-split');
        modal.querySelectorAll('#e-split button').forEach(b => b.classList.toggle('on', b === btn));
        syncCustomVisibility();
      };
    });
    modal.querySelectorAll('.check-item').forEach(row => {
      const cb = row.querySelector('input[type=checkbox]');
      const amt = row.querySelector('.custom-amt');
      cb.onchange = () => {
        row.classList.toggle('on', cb.checked);
        amt.disabled = !cb.checked;
        if (mode === 'custom') syncAmountField();
        updateHint();
      };
      amt.oninput = () => {
        if (mode === 'custom') syncAmountField();
        updateHint();
      };
    });
    amountInput.oninput = updateHint;
    modal.querySelector('#e-cur').onchange = () => {
      if (mode === 'custom') syncAmountField();
      updateHint();
    };
    syncCustomVisibility();

    modal.querySelector('#e-save').onclick = () => {
      const title = modal.querySelector('#e-title').value.trim();
      const currency = modal.querySelector('#e-cur').value;
      const payerId = modal.querySelector('#e-payer').value;
      const shares = [];
      let badCustom = false;
      modal.querySelectorAll('.check-item').forEach(row => {
        const cb = row.querySelector('input[type=checkbox]');
        if (!cb.checked) return;
        const mid = row.getAttribute('data-mid');
        if (mode === 'custom') {
          const a = parseFloat(row.querySelector('.custom-amt').value);
          if (!(a >= 0) || Number.isNaN(a)) { badCustom = true; return; }
          shares.push({ memberId: mid, amount: a });
        } else {
          shares.push({ memberId: mid });
        }
      });
      if (badCustom) { toast('請填自訂金額'); return; }
      if (!shares.length) { toast('請至少勾選一位分攤'); return; }
      let amount;
      if (mode === 'custom') {
        amount = shares.reduce((s, x) => s + x.amount, 0);
        amount = roundMoney(amount, currency);
        amountInput.value = String(amount);
      } else {
        amount = parseFloat(amountInput.value);
      }
      if (!(amount > 0)) { toast(mode === 'custom' ? '請填自訂金額' : '請輸入金額'); return; }
      const dateVal = modal.querySelector('#e-date').value || todayTaipei();
      const payload = {
        id: exp?.id || uid(),
        title, amount, currency, payerId,
        date: dateVal,
        splitType: mode,
        shares,
        updatedAt: Date.now(),
        createdAt: exp?.createdAt || Date.now(),
      };
      payload.photoIds = [...existingPhotoIds];
      if (exp) {
        const idx = t.expenses.findIndex(e => e.id === exp.id);
        t.expenses[idx] = payload;
      } else {
        t.expenses.push(payload);
      }
      // Upload pending photos after expense exists on trip
      const uploadPending = async () => {
        for (const ph of pendingPhotos) {
          try {
            const r = await fetch(`/api/trips/${t.code}/expenses/${payload.id}/photos`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ dataUrl: ph.dataUrl }),
            });
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              throw new Error(err.error || 'upload');
            }
            const j = await r.json();
            payload.photoIds = payload.photoIds || [];
            if (!payload.photoIds.includes(j.id)) payload.photoIds.push(j.id);
            // refresh from server trip after saveTrip on server
          } catch (e) {
            toast('照片上傳失敗');
          }
        }
      };
      scheduleSave();
      closeModal();
      render();
      toast(exp ? '已更新' : '已記一筆');
      if (pendingPhotos.length) {
        uploadPending().then(async () => {
          // pull latest so photoIds sync
          try {
            const r = await fetch(`/api/trips/${t.code}`);
            if (r.ok) {
              const fresh = await r.json();
              if (fresh && fresh.updatedAt >= (state.trip.updatedAt || 0)) {
                state.trip = fresh;
                saveLocal();
                render();
              }
            }
          } catch (_) {}
        });
      }
    };
  });
}


function openLightbox(src) {
  const el = document.createElement('div');
  el.className = 'lightbox';
  el.innerHTML = `<button type="button" class="x" aria-label="關閉">×</button><img src="${src}" alt="收據">`;
  el.querySelector('.x').onclick = () => el.remove();
  el.onclick = (ev) => { if (ev.target === el) el.remove(); };
  document.body.appendChild(el);
}

async function compressImageFile(file, maxEdge = 1280, quality = 0.7, targetBytes = 300 * 1024) {
  const bitmap = await createImageBitmap(file);
  let w = bitmap.width, h = bitmap.height;
  const scale = Math.min(1, maxEdge / Math.max(w, h));
  w = Math.max(1, Math.round(w * scale));
  h = Math.max(1, Math.round(h * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, w, h);
  bitmap.close && bitmap.close();
  let q = quality;
  let blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
  while (blob && blob.size > targetBytes && q > 0.35) {
    q -= 0.1;
    blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
  }
  if (!blob) throw new Error('compress');
  // If still huge, shrink further
  if (blob.size > targetBytes) {
    const scale2 = Math.sqrt(targetBytes / blob.size) * 0.95;
    canvas.width = Math.max(1, Math.round(w * scale2));
    canvas.height = Math.max(1, Math.round(h * scale2));
    ctx.drawImage(await createImageBitmap(blob), 0, 0, canvas.width, canvas.height);
    blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.65));
  }
  if (!blob || blob.size > 350 * 1024) throw new Error('too_large');
  return await new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

async function boot() {
  loadLocal();
  const code = parseHash();
  if (code) {
    await joinTrip(code);
  } else {
    render();
  }
  window.addEventListener('hashchange', () => {
    const c = parseHash();
    if (c && (!state.trip || state.trip.code !== c)) joinTrip(c);
    if (!c && state.view !== 'home') {
      state.view = 'home';
      render();
    }
  });
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-photo-view]');
    if (!t || !state.trip) return;
    const pid = t.getAttribute('data-photo-view');
    openLightbox(`/api/trips/${state.trip.code}/photos/${pid}`);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.trip) {
      connectSSE(state.trip.code);
      pushTrip();
    }
  });
}

boot();
})();
</script>
